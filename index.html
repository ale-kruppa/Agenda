<!doctype html>
<html lang="es" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#FBF5F3">
<meta name="description" content="Mi espacio: agenda de uñas, ciclo menstrual, turnos y avisos. Todo en un solo lugar, guardado en tu dispositivo.">
<link rel="icon" href="./icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="./icon-192.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Mi espacio">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Nunito+Sans:wght@400;600;700;800&display=swap">
<title>Mi espacio</title>
<style>
:root {
  --radius: 22px; --radius-sm: 18px; --radius-xs: 12px;
  --font: 'Nunito Sans', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  --font-display: 'Fraunces', Georgia, "Times New Roman", serif;
}
[data-theme="light"] {
  color-scheme: light;
  --bg: #FBF5F3; --bg-soft: #F6ECEE;
  --card: #FFFFFF; --card-hover: #FDF7F8;
  --border: #EFE1E3; --border-soft: #F3E7EA; --border-strong: #E3C9D2;
  --ink: #2B1F24; --ink-strong: #2B1F24;
  --muted: #75636A; --muted-soft: #A8979D;
  --accent: #B0446E; --accent-strong: #8E3358; --accent-soft: #F6E3E8; --accent-tint: #FBF0F3; --on-accent: #FFFFFF;
  --hero-sub: #FBE3EC;
  --good: #2C6B49; --good-soft: #E3F1E9;
  --warn: #8A4A0E; --warn-soft: #FBEEDD;
  --danger: #A12C2C; --danger-soft: #FBE6E6;
  --info: #3F6694; --info-soft: #E7EEF8;
  --nav-bg: rgba(255,255,255,.96);
  --shadow: 0 10px 30px -14px rgba(43,31,36,.28);
  --shadow-accent: 0 14px 30px -14px rgba(176,68,110,.55);
  --phase-menstrual: #C2456F; --phase-follicular: #9DB8DC;
  --phase-fertile: #6FB08C; --phase-luteal: #E9C48A;
}
[data-theme="dark"] {
  color-scheme: dark;
  --bg: #1A1416; --bg-soft: #241C1F;
  --card: #261D21; --card-hover: #2E2428;
  --border: #3A2D32; --border-soft: #30252A; --border-strong: #4A3940;
  --ink: #F5ECEF; --ink-strong: #FFF7FA;
  --muted: #BBA8AF; --muted-soft: #8C7A81;
  --accent: #E58AAE; --accent-strong: #F2A9C5; --accent-soft: #3D2530; --accent-tint: #33222A; --on-accent: #2B1018;
  --hero-sub: #4A1F31;
  --good: #8FD3AE; --good-soft: #1F3328;
  --warn: #F2C08A; --warn-soft: #3A2A18;
  --danger: #F2A0A0; --danger-soft: #3A1E1E;
  --info: #A9C4EA; --info-soft: #1F2A3A;
  --nav-bg: rgba(38,29,33,.96);
  --shadow: 0 10px 30px -14px rgba(0,0,0,.7);
  --shadow-accent: 0 14px 30px -14px rgba(229,138,174,.35);
  --phase-menstrual: #D9668F; --phase-follicular: #8FAFD9;
  --phase-fertile: #6FB08C; --phase-luteal: #E0B86F;
}
html { scroll-behavior: smooth; -webkit-text-size-adjust: 100%; }
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: var(--font); background: var(--bg); color: var(--ink); min-height: 100vh; -webkit-font-smoothing: antialiased; line-height: 1.4; }
button { font: inherit; border: 0; background: none; color: inherit; cursor: pointer; -webkit-tap-highlight-color: transparent; }
a { color: var(--accent); text-decoration: none; -webkit-tap-highlight-color: transparent; }
button:focus-visible, a:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible, summary:focus-visible, [role="button"]:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
button:disabled { opacity: .55; cursor: not-allowed; }
svg.ico { width: 20px; height: 20px; flex-shrink: 0; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }

/* Encabezado (solo pantallas grandes) */
.app-header { display: none; position: sticky; top: 0; z-index: 50; background: var(--nav-bg); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); border-bottom: 1px solid var(--border); }
.header-inner { max-width: 760px; margin: 0 auto; padding: 12px 20px; display: flex; align-items: center; gap: 12px; }
.brand { display: flex; align-items: center; gap: 10px; cursor: pointer; padding: 4px 6px; border-radius: 12px; }
.brand-icon { width: 34px; height: 34px; border-radius: 11px; background: var(--accent); color: var(--on-accent); display: grid; place-items: center; }
.brand-text { font-family: var(--font-display); font-weight: 600; font-size: 1.15rem; color: var(--ink-strong); }
.nav-desktop { display: flex; flex: 1; gap: 2px; margin-left: 8px; }
.nav-desktop button { padding: 9px 12px; border-radius: 12px; font-size: .9rem; font-weight: 700; color: var(--muted); display: inline-flex; align-items: center; gap: 7px; }
.nav-desktop button:hover { color: var(--ink); background: var(--card-hover); }
.nav-desktop button.active { color: var(--accent); background: var(--accent-soft); }

.app-main { max-width: 640px; margin: 0 auto; padding: calc(24px + env(safe-area-inset-top)) 18px calc(112px + env(safe-area-inset-bottom)); min-height: 100vh; }
.view-enter { animation: viewIn .3s cubic-bezier(.2,.8,.2,1); }
@keyframes viewIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }

/* Títulos */
.page-head { margin-bottom: 18px; display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; }
.page-head .ph-text { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.page-head .tag { font-size: .82rem; font-weight: 700; color: var(--muted); }
.page-head .tag.cap::first-letter { text-transform: uppercase; }
.page-head h1 { font-family: var(--font-display); font-weight: 600; font-size: 1.9rem; line-height: 1.15; color: var(--ink-strong); letter-spacing: -.01em; }
.page-head p { color: var(--muted); font-size: .95rem; line-height: 1.5; }
.icon-btn { width: 44px; height: 44px; border-radius: 22px; border: 1px solid var(--border); background: var(--card); color: var(--muted); display: grid; place-items: center; flex-shrink: 0; }
.icon-btn:hover { color: var(--accent); }
.back-row { display: flex; align-items: center; gap: 10px; }

.panel { background: var(--card); border: 1px solid var(--border); border-radius: var(--radius); padding: 18px; margin-top: 14px; }
.panel h2 { font-family: var(--font-display); font-size: 1.2rem; font-weight: 600; margin-bottom: 6px; color: var(--ink-strong); }
.panel > p { color: var(--muted); margin-bottom: 14px; font-size: .9rem; line-height: 1.5; }
.section-title { font-family: var(--font-display); font-size: 1.2rem; font-weight: 600; color: var(--ink-strong); margin: 24px 0 10px; }

/* Secciones plegables */
details.fold { background: var(--card); border: 1px solid var(--border); border-radius: var(--radius); margin-top: 14px; }
details.fold > summary { list-style: none; cursor: pointer; display: flex; align-items: center; justify-content: space-between; gap: 10px; min-height: 56px; padding: 0 18px; font-weight: 800; font-size: 1rem; color: var(--ink-strong); }
details.fold > summary::-webkit-details-marker { display: none; }
details.fold > summary .chev { color: var(--muted); transition: transform .2s ease; }
details.fold[open] > summary .chev { transform: rotate(90deg); }
details.fold > summary .sum-left { display: inline-flex; align-items: center; gap: 10px; }
details.fold > summary .sum-left .ico { color: var(--accent); }
details.fold > .fold-body { padding: 0 18px 18px; }
details.fold > .fold-body > p { color: var(--muted); margin-bottom: 14px; font-size: .9rem; line-height: 1.5; }

.alert-banner { display: flex; align-items: center; gap: 12px; padding: 14px 16px; border-radius: var(--radius-sm); background: var(--warn-soft); color: var(--warn); font-size: .92rem; font-weight: 700; margin-bottom: 12px; line-height: 1.4; }
.alert-banner[data-view] { cursor: pointer; }
.btn.is-added, .btn-light.is-added { color: var(--good); }
button.nail-thumb { border: 1.5px dashed var(--border-strong); background: var(--accent-tint); color: var(--accent); cursor: pointer; }
.alert-banner.danger { background: var(--danger-soft); color: var(--danger); }
.alert-banner .ab-icon { display: grid; place-items: center; flex-shrink: 0; }

/* Tarjeta destacada */
.hero { background: var(--accent); color: var(--on-accent); border-radius: 24px; padding: 20px; display: flex; flex-direction: column; gap: 14px; box-shadow: var(--shadow-accent); margin-bottom: 14px; }
.hero .hero-kicker { display: flex; align-items: center; gap: 8px; font-size: .75rem; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; opacity: .9; }
.hero .hero-title { font-family: var(--font-display); font-size: 1.65rem; font-weight: 600; line-height: 1.2; }
.hero .hero-sub { font-size: .95rem; opacity: .9; margin-top: 2px; }
.hero .hero-actions { display: flex; gap: 10px; flex-wrap: wrap; }
.hero .btn-light { display: inline-flex; align-items: center; gap: 8px; min-height: 44px; padding: 0 16px; border-radius: 22px; background: var(--card); color: var(--accent-strong); font-weight: 800; font-size: .9rem; }
.hero .btn-outline-light { display: inline-flex; align-items: center; gap: 8px; min-height: 44px; padding: 0 16px; border-radius: 22px; border: 1px solid currentColor; color: var(--on-accent); font-weight: 800; font-size: .9rem; }

/* Mini tarjetas resumen */
.summary-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; margin-bottom: 4px; }
.summary-card { background: var(--card); border: 1px solid var(--border); border-radius: 20px; padding: 14px; display: flex; flex-direction: column; gap: 6px; cursor: pointer; transition: transform .15s ease, border-color .15s ease; min-width: 0; }
.summary-card:hover { border-color: var(--border-strong); }
.summary-card:active { transform: scale(.98); }
.summary-card .sc-ico { width: 36px; height: 36px; border-radius: 12px; background: var(--accent-soft); color: var(--accent); display: grid; place-items: center; margin-bottom: 2px; }
.summary-card .sc-ico .ico { width: 18px; height: 18px; }
.summary-card[data-tone="ciclo"] .sc-ico { background: var(--accent-soft); color: var(--phase-menstrual); }
.summary-card[data-tone="turnos"] .sc-ico { background: var(--info-soft); color: var(--info); }
.summary-card[data-tone="avisos"] .sc-ico { background: var(--warn-soft); color: var(--warn); }
.summary-card[data-tone="good"] .sc-ico { background: var(--good-soft); color: var(--good); }
.summary-card[data-tone="muted"] .sc-ico { background: var(--bg-soft); color: var(--muted); }
.summary-card .sc-label { font-size: .78rem; color: var(--muted); font-weight: 700; }
.summary-card .sc-value { font-size: 1.05rem; font-weight: 800; color: var(--ink-strong); line-height: 1.25; overflow-wrap: anywhere; }
.summary-card .sc-sub { font-size: .8rem; color: var(--muted); line-height: 1.35; }
.summary-card.is-empty .sc-value { color: var(--muted); font-weight: 700; }
.summary-card.is-warn .sc-sub, .summary-card.is-warn .sc-value { color: var(--warn); }
.summary-card.is-overdue .sc-value { color: var(--danger); }
.summary-card.is-today .sc-value { color: var(--accent); }

/* Lista de eventos */
.event-list { background: var(--card); border: 1px solid var(--border); border-radius: 20px; padding: 2px 14px; }
.event-item { display: flex; align-items: center; gap: 12px; padding: 12px 0; border-bottom: 1px solid var(--border-soft); cursor: pointer; }
.event-item:last-child { border-bottom: 0; }
.event-item .ei-date { width: 46px; display: flex; flex-direction: column; align-items: center; flex-shrink: 0; }
.event-item .ei-day { font-size: 1.15rem; font-weight: 800; line-height: 1; color: var(--ink-strong); }
.event-item .ei-dow { font-size: .7rem; font-weight: 800; color: var(--muted); text-transform: uppercase; margin-top: 3px; }
.event-item.is-today .ei-dow { color: var(--warn); }
.event-item .ei-body { flex: 1; min-width: 0; }
.event-item .ei-title { font-weight: 700; font-size: .93rem; color: var(--ink-strong); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.event-item .ei-meta { font-size: .8rem; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.event-item .ei-when { font-size: .78rem; font-weight: 800; color: var(--muted); flex-shrink: 0; }

.empty-dashboard { text-align: center; padding: 28px 20px; background: var(--card); border: 1px dashed var(--border-strong); border-radius: var(--radius); margin-top: 14px; }
.empty-dashboard h2 { font-family: var(--font-display); font-size: 1.25rem; font-weight: 600; color: var(--ink-strong); margin-bottom: 6px; }
.empty-dashboard p { color: var(--muted); font-size: .9rem; margin-bottom: 18px; line-height: 1.5; }
.empty-shortcuts { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
.empty-shortcuts button { display: flex; flex-direction: column; align-items: center; gap: 6px; padding: 14px 8px; background: var(--accent-tint); border: 1px solid var(--border); border-radius: 16px; font-size: .88rem; font-weight: 700; color: var(--ink); }
.empty-shortcuts button .es-ico { color: var(--accent); display: grid; place-items: center; }

.placeholder { background: var(--card); border: 1px dashed var(--border); border-radius: var(--radius); padding: 40px 24px; text-align: center; margin-top: 20px; }
.placeholder h2 { font-family: var(--font-display); font-size: 1.2rem; margin-bottom: 8px; }
.placeholder p { color: var(--muted); }

/* Botones */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 46px; padding: 0 18px; border-radius: 23px; font-weight: 800; font-size: .92rem; transition: filter .15s ease, transform .1s ease, background-color .15s ease; text-align: center; }
.btn:active:not(:disabled) { transform: scale(.97); }
.btn-primary { background: var(--accent); color: var(--on-accent); }
.btn-primary:hover { filter: brightness(1.06); }
.btn-secondary { background: var(--accent-tint); color: var(--accent-strong); border: 1px solid var(--border-strong); }
.btn-secondary:hover { background: var(--accent-soft); }
.btn-ghost { border: 1px solid var(--border); color: var(--ink); background: var(--card); }
.btn-ghost:hover { background: var(--card-hover); }
.btn-danger { background: var(--danger-soft); color: var(--danger); }
.btn-text-danger { color: var(--danger); font-weight: 800; min-height: 44px; padding: 0 8px; }
.btn-sm { min-height: 38px; padding: 0 14px; font-size: .84rem; }
.btn-icon { width: 44px; height: 44px; min-height: 44px; padding: 0; border-radius: 22px; }
.btn-block { width: 100%; }
.actions { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 14px; }

/* Formularios */
.form-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
.form-grid .full { grid-column: 1 / -1; }
label { display: block; font-size: .88rem; font-weight: 800; margin-bottom: 6px; color: var(--ink); }
input, select, textarea { width: 100%; font: inherit; font-size: 16px; min-height: 48px; padding: 10px 14px; border: 1px solid var(--border-strong); border-radius: 14px; background: var(--bg); color: var(--ink); }
input:focus, select:focus, textarea:focus { outline: none; border-color: var(--accent); background: var(--card); }
textarea { resize: vertical; min-height: 80px; }
input[type="file"] { padding: 10px; cursor: pointer; }
.field-hint { font-size: .8rem; color: var(--muted); margin-top: 6px; line-height: 1.4; }
.required { color: var(--danger); }

/* Uñas */
.cards-grid { display: grid; grid-template-columns: 1fr; gap: 14px; }
.nail-card { background: var(--card); border: 1px solid var(--border); border-radius: 24px; padding: 18px; display: flex; flex-direction: column; gap: 14px; }
.card-top { display: flex; gap: 14px; align-items: center; }
.nail-thumb { width: 64px; height: 64px; border-radius: 18px; background: var(--accent-soft); color: var(--muted); display: grid; place-items: center; flex-shrink: 0; overflow: hidden; border: 0; padding: 0; }
.nail-thumb img { width: 100%; height: 100%; object-fit: cover; cursor: zoom-in; display: block; }
.card-top .ct-text { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
.card-top h3 { font-family: var(--font-display); font-size: 1.3rem; font-weight: 600; color: var(--ink-strong); }
.card-top small { color: var(--muted); font-size: .84rem; }
.nail-due { display: flex; flex-direction: column; gap: 6px; }
.nail-due .nd-row { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; }
.nail-due .nd-big { font-size: 1.6rem; font-weight: 800; letter-spacing: -.01em; color: var(--ink-strong); }
.nail-due .nd-big.warn { color: var(--warn); } .nail-due .nd-big.overdue { color: var(--danger); } .nail-due .nd-big.today { color: var(--accent); }
.nail-due .nd-date { font-size: .84rem; color: var(--muted); font-weight: 700; }
.nail-due .nd-hint { font-size: .78rem; color: var(--muted); }
.progress { height: 10px; border-radius: 5px; background: var(--border-soft); overflow: hidden; }
.progress > span { display: block; height: 100%; border-radius: 5px; background: var(--accent); }
.progress.soft > span { background: var(--muted-soft); }
.nail-actions { display: flex; gap: 10px; }
.nail-actions .btn-primary, .nail-actions .btn-secondary { flex: 1; }
.pill { display: inline-block; align-self: center; font-size: .76rem; font-weight: 800; background: var(--good-soft); color: var(--good); padding: 6px 10px; border-radius: 999px; white-space: nowrap; }
.pill.warn { background: var(--warn-soft); color: var(--warn); }
.pill.overdue { background: var(--danger-soft); color: var(--danger); }
.pill.today { background: var(--accent-soft); color: var(--accent-strong); }
.pill.none { background: var(--bg-soft); color: var(--muted); }
.photo-strip { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
.photo-strip button { position: relative; aspect-ratio: 1; border-radius: 16px; overflow: hidden; background: var(--accent-soft); padding: 0; }
.photo-strip img { width: 100%; height: 100%; object-fit: cover; display: block; }
.photo-strip .ps-tag { position: absolute; left: 6px; bottom: 6px; font-size: .7rem; font-weight: 800; color: #3B2430; background: rgba(255,255,255,.85); padding: 2px 7px; border-radius: 999px; }
.photo-preview-wrap { margin-top: 10px; }
.photo-preview img { max-width: 100%; max-height: 180px; border-radius: 14px; display: block; }

.history-item { display: flex; justify-content: space-between; gap: 12px; padding: 12px 0; border-bottom: 1px solid var(--border-soft); align-items: center; }
.history-item:last-child { border-bottom: 0; }
.history-left { display: flex; gap: 12px; align-items: center; min-width: 0; }
.history-thumb { width: 48px; height: 48px; object-fit: cover; border-radius: 12px; cursor: zoom-in; flex-shrink: 0; }
.history-item strong { display: block; font-size: .95rem; color: var(--ink-strong); }
.history-item small { color: var(--muted); font-size: .82rem; display: block; margin-top: 2px; }
.history-item .btn { flex-shrink: 0; }
.empty { color: var(--muted); padding: 14px 0; font-size: .9rem; text-align: center; }

/* Ciclo */
.cycle-hero { background: var(--card); border: 1px solid var(--border); border-radius: 24px; padding: 22px 18px; display: flex; flex-direction: column; align-items: center; gap: 14px; text-align: center; }
.cycle-ring { width: 156px; height: 156px; border-radius: 50%; display: grid; place-items: center; }
.cycle-ring .cr-inner { width: 128px; height: 128px; border-radius: 50%; background: var(--card); display: flex; flex-direction: column; align-items: center; justify-content: center; }
.cycle-ring .cr-label { font-size: .82rem; font-weight: 700; color: var(--muted); }
.cycle-ring .cr-num { font-family: var(--font-display); font-size: 2.9rem; font-weight: 600; line-height: 1; color: var(--ink-strong); }
.cycle-hero .ch-title { font-size: 1.15rem; font-weight: 800; color: var(--ink-strong); }
.cycle-hero .ch-title.overdue { color: var(--danger); }
.cycle-hero .ch-sub { font-size: .9rem; color: var(--muted); }
.cycle-hero .quick-actions { width: 100%; display: flex; flex-direction: column; gap: 10px; }
.cycle-hero .quick-actions .btn { width: 100%; }
.phase-wrap { padding-top: 22px; position: relative; }
.phase-bar { display: flex; gap: 2px; height: 14px; border-radius: 7px; position: relative; }
.phase-segment { height: 100%; }
.phase-segment:first-child { border-radius: 7px 0 0 7px; }
.phase-segment:last-child { border-radius: 0 7px 7px 0; }
.phase-segment.menstrual { background: var(--phase-menstrual); }
.phase-segment.follicular { background: var(--phase-follicular); }
.phase-segment.fertile { background: var(--phase-fertile); }
.phase-segment.luteal { background: var(--phase-luteal); }
.phase-marker { position: absolute; top: -20px; transform: translateX(-50%); color: var(--ink-strong); font-size: .85rem; line-height: 1; pointer-events: none; }
.phase-marker.overdue { color: var(--danger); }
.phase-legend { display: flex; flex-wrap: wrap; gap: 6px 14px; margin-top: 14px; font-size: .8rem; color: var(--muted); font-weight: 700; }
.phase-legend span { display: inline-flex; align-items: center; gap: 6px; }
.phase-legend .dot { display: inline-block; width: 10px; height: 10px; border-radius: 50%; }
.phase-legend .dot.menstrual { background: var(--phase-menstrual); }
.phase-legend .dot.follicular { background: var(--phase-follicular); }
.phase-legend .dot.fertile { background: var(--phase-fertile); }
.phase-legend .dot.luteal { background: var(--phase-luteal); }
.phase-today-label { margin-top: 12px; font-size: .9rem; color: var(--muted); line-height: 1.5; }

.end-form { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-top: 8px; }

.stats-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }

/* Turnos */
.appt-list, .reminder-list { display: flex; flex-direction: column; gap: 10px; }

.appt-item.today .appt-date-badge { background: var(--warn-soft); color: var(--warn); }
.appt-item.overdue .appt-date-badge { background: var(--danger-soft); color: var(--danger); }

.edit-form .form-grid { gap: 10px; }

.list-block { margin-top: 18px; }
.filter-tabs { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 4px; padding: 4px; border-radius: 16px; background: var(--bg-soft); margin-bottom: 14px; }

/* Avisos */
.reminder-item { display: flex; gap: 12px; align-items: flex-start; flex-wrap: wrap; padding: 14px; background: var(--card); border: 1px solid var(--border); border-radius: 20px; }

.reminder-check:hover:not(:disabled) { border-color: var(--accent); background: var(--accent-soft); }

.reminder-body { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 4px; }

/* Ajustes */
.settings-list { display: flex; flex-direction: column; gap: 10px; }

.segmented button.active { background: var(--card); color: var(--accent-strong); font-weight: 800; box-shadow: 0 2px 8px -3px rgba(43,31,36,.25); }
.greet-preview { font-size: .85rem; color: var(--muted); margin-top: 8px; }
.greet-preview strong { color: var(--ink-strong); }
.danger-zone { text-align: center; margin-top: 18px; }
.danger-zone .dz-desc { color: var(--muted); font-size: .82rem; line-height: 1.5; margin-top: 4px; }

/* Bienvenida */
.welcome { max-width: 460px; margin: 0 auto; padding-top: 32px; display: flex; flex-direction: column; gap: 26px; }
.welcome .w-logo { width: 84px; height: 84px; border-radius: 28px; background: var(--accent); display: grid; place-items: center; box-shadow: var(--shadow-accent); overflow: hidden; }
.welcome .w-logo img { width: 100%; height: 100%; }
.welcome h1 { font-family: var(--font-display); font-weight: 600; font-size: 2.1rem; line-height: 1.15; color: var(--ink-strong); }

.lightbox { position: fixed; inset: 0; background: rgba(20,12,16,.92); display: flex; align-items: center; justify-content: center; padding: 20px; z-index: 250; }
.lightbox[hidden] { display: none; }

.lightbox-close { position: absolute; top: calc(16px + env(safe-area-inset-top, 0px)); right: 16px; width: 44px; height: 44px; border-radius: 50%; background: #FFFFFF; color: #2B1F24; font-size: 1.5rem; line-height: 1; display: grid; place-items: center; }

/* Barra de abajo */
.nav-mobile { position: fixed; left: 12px; right: 12px; bottom: calc(12px + env(safe-area-inset-bottom)); z-index: 60; height: 66px; background: var(--nav-bg); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); border: 1px solid var(--border); border-radius: 26px; box-shadow: var(--shadow); display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); align-items: center; max-width: 560px; margin: 0 auto; }
.nav-mobile button { display: flex; flex-direction: column; align-items: center; gap: 3px; padding: 6px 2px; color: var(--muted); font-size: .74rem; font-weight: 700; min-width: 0; min-height: 56px; justify-content: center; }
.nav-mobile button .nm-label { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 100%; }

.toast { position: fixed; left: 50%; bottom: calc(92px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%) translateY(16px); background: var(--ink-strong); color: var(--bg); padding: 12px 16px; border-radius: 16px; box-shadow: var(--shadow); font-size: .9rem; font-weight: 700; max-width: calc(100vw - 32px); width: max-content; opacity: 0; pointer-events: none; transition: opacity .2s ease, transform .2s ease; z-index: 300; display: flex; align-items: center; gap: 14px; }
.toast.show { opacity: 1; transform: translateX(-50%) translateY(0); pointer-events: auto; }
.toast.error { background: var(--danger); color: #fff; }
.toast .toast-action { background: var(--accent); color: var(--on-accent); padding: 6px 12px; border-radius: 10px; font-size: .82rem; font-weight: 800; flex-shrink: 0; }

@media (min-width: 768px) {

}

}

      <span class="brand-icon" aria-hidden="true"><svg class="ico" viewBox="0 0 24 24"><path d="M12 3s6 6.5 6 11a6 6 0 0 1-12 0c0-4.5 6-11 6-11z"/></svg></span>

    <button class="icon-btn" id="headerSettings" type="button" aria-label="Ajustes"><svg class="ico" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M4.9 19.1 7 17M17 7l2.1-2.1"/></svg></button>
  </div>

<div class="toast" id="toast" role="status" aria-live="polite" aria-atomic="true"></div>

<script>
(() => {
  'use strict';

  const THEME_KEY = 'hubThemeV1';
  const DEFAULT_THEME = 'light';
  const KEY_UNAS = 'agendaUnasDemoV1';
  const KEY_CICLO = 'miCicloV1';
  const KEY_TURNOS = 'hubTurnosV1';
  const KEY_RECORDATORIOS = 'hubRecordatoriosV1';
  const KEY_PERFIL = 'hubPerfilV1';
  const KEY_CAL = 'hubCalAddedV1';
  const HUB_VERSION = '3.0.0';

  /* Íconos de línea (SVG) */
  const ICON_PATHS = {
    home: '<path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1z"/>',
    nails: '<path d="M12 3v4M12 17v4M3 12h4M17 12h4M6 6l2.5 2.5M15.5 15.5 18 18M6 18l2.5-2.5M15.5 8.5 18 6"/>',
    drop: '<path d="M12 3s6 6.5 6 11a6 6 0 0 1-12 0c0-4.5 6-11 6-11z"/>',
    calendar: '<rect x="3" y="5" width="18" height="16" rx="3"/><path d="M3 10h18M8 3v4M16 3v4"/>',
    calPlus: '<rect x="3" y="5" width="18" height="16" rx="3"/><path d="M3 10h18M8 3v4M16 3v4M12 13v5M9.5 15.5h5"/>',
    calCheck: '<rect x="3" y="5" width="18" height="16" rx="3"/><path d="M3 10h18M8 3v4M16 3v4M9 15.5l2 2 4-4"/>',
    bell: '<path d="M6 16V11a6 6 0 0 1 12 0v5l1.5 2h-15z"/><path d="M10 20a2 2 0 0 0 4 0"/>',
    gear: '<circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M4.9 19.1 7 17M17 7l2.1-2.1"/>',
    plus: '<path d="M12 5v14M5 12h14"/>',
    camera: '<rect x="3" y="7" width="18" height="13" rx="3"/><circle cx="12" cy="13.5" r="3.5"/><path d="M9 7l1.5-3h3L15 7"/>',
    check: '<path d="M5 12.5l4.5 4.5L19 7.5"/>',
    x: '<path d="M6 6l12 12M18 6 6 18"/>',
    edit: '<path d="M4 20h4L19 9l-4-4L4 16z"/><path d="M13.5 6.5l4 4"/>',
    trash: '<path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"/>',
    back: '<path d="M15 6l-6 6 6 6"/>',
    chevron: '<path d="M9 6l6 6-6 6"/>',
    alert: '<path d="M12 4 2.5 20h19z"/><path d="M12 10v4M12 17.5v.01"/>',
    clock: '<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>',
    pin: '<path d="M12 21s7-6.2 7-11.5a7 7 0 0 0-14 0C5 14.8 12 21 12 21z"/><circle cx="12" cy="9.5" r="2.5"/>',
    list: '<path d="M8 6h12M8 12h12M8 18h12M4 6h.01M4 12h.01M4 18h.01"/>',
    hourglass: '<path d="M6 3h12M6 21h12M7 3c0 5 10 5 10 9s-10 4-10 9M17 3c0 5-10 5-10 9s10 4 10 9"/>',
    sparkle: '<path d="M12 3l1.8 5.2L19 10l-5.2 1.8L12 17l-1.8-5.2L5 10l5.2-1.8z"/>',
    download: '<path d="M12 4v11M7 10l5 5 5-5M5 20h14"/>',
    upload: '<path d="M12 20V9M7 14l5-5 5 5M5 4h14"/>',
  };
  const icon = (name, extra = '') => `<svg class="ico ${extra}" viewBox="0 0 24 24" aria-hidden="true">${ICON_PATHS[name] || ''}</svg>`;

  const VIEWS = {
    inicio:        { label: 'Inicio',  icon: 'home',     title: 'Inicio',         nav: true },
    unas:          { label: 'Uñas',    icon: 'nails',    title: 'Mis uñas',       nav: true },
    ciclo:         { label: 'Ciclo',   icon: 'drop',     title: 'Mi ciclo',       nav: true },
    turnos:        { label: 'Turnos',  icon: 'calendar', title: 'Turnos',         nav: true },
    recordatorios: { label: 'Avisos',  icon: 'bell',     title: 'Avisos',         nav: true },
    ajustes:       { label: 'Ajustes', icon: 'gear',     title: 'Ajustes',        nav: false },
    bienvenida:    { label: 'Bienvenida', icon: 'sparkle', title: 'Bienvenida',   nav: false },
  };
  const DEFAULT_VIEW = 'inicio';

  /* Perfil (nombre) */
  let profileMem = null;
  const loadProfile = () => {
    if (profileMem) return { ...profileMem };
    try {
      const raw = JSON.parse(localStorage.getItem(KEY_PERFIL) || 'null');
      if (raw && typeof raw === 'object') return { name: typeof raw.name === 'string' ? raw.name.slice(0, 30) : '', welcomed: !!raw.welcomed };
    } catch (e) {}
    return { name: '', welcomed: false };
  };
  const saveProfile = p => {
    const clean = { name: (p.name || '').trim().slice(0, 30), welcomed: !!p.welcomed };
    profileMem = clean;
    try { localStorage.setItem(KEY_PERFIL, JSON.stringify(clean)); return true; }
    catch (e) { return false; }
  };
  const greetingFor = name => { const n = (name || '').trim(); return n ? `Hola, ${n}` : 'Hola'; };

  /* Google Calendar: arma el link para crear un evento ya completado */
  const gcalUrl = ({ title, date, time, details, location }) => {
    if (!date) return '';
    const d = date.replace(/-/g, '');
    let dates;
    if (time && /^\d{2}:\d{2}$/.test(time)) {
      const [h, m] = time.split(':').map(Number);
      const start = new Date(+date.slice(0, 4), +date.slice(5, 7) - 1, +date.slice(8, 10), h, m);
      const end = new Date(start.getTime() + 60 * 60000);
      const f = dt => `${dt.getFullYear()}${String(dt.getMonth() + 1).padStart(2, '0')}${String(dt.getDate()).padStart(2, '0')}T${String(dt.getHours()).padStart(2, '0')}${String(dt.getMinutes()).padStart(2, '0')}00`;
      dates = `${f(start)}/${f(end)}`;
    } else {
      dates = `${d}/${addDaysISO(date, 1).replace(/-/g, '')}`;
    }
    const p = new URLSearchParams({ action: 'TEMPLATE', text: title || 'Evento', dates });
    if (details) p.set('details', details);
    if (location) p.set('location', location);
    try { const tz = Intl.DateTimeFormat().resolvedOptions().timeZone; if (tz) p.set('ctz', tz); } catch (e) {}
    return 'https://calendar.google.com/calendar/render?' + p.toString();
  };
  const loadCalAdded = () => {
    try { const raw = JSON.parse(localStorage.getItem(KEY_CAL) || '{}'); return raw && typeof raw === 'object' ? raw : {}; }
    catch (e) { return {}; }
  };
  const calKey = o => `${o.date}|${o.time || ''}|${o.title || ''}`;
  const markCalAdded = key => {
    const all = loadCalAdded();
    const limit = addDaysISO(todayISO(), -60);
    for (const k of Object.keys(all)) if (k.slice(0, 10) < limit) delete all[k];
    all[key] = 1;
    try { localStorage.setItem(KEY_CAL, JSON.stringify(all)); } catch (e) {}
  };
  const ADDED_LABEL = 'Ya agendado (tocá para agregarlo otra vez)';
  const gcalLink = (opts, { label = 'Agregar a Google Calendar', cls = 'btn btn-secondary', iconOnly = false } = {}) => {
    const url = gcalUrl(opts);
    if (!url) return '';
    const key = calKey(opts);
    const added = !!loadCalAdded()[key];
    const ic = icon(added ? 'calCheck' : 'calPlus');
    const aria = added ? ADDED_LABEL : label;
    const base = `class="${cls}${added ? ' is-added' : ''}" href="${escapeHtml(url)}" target="_blank" rel="noopener" data-cal-key="${escapeHtml(key)}"`;
    return iconOnly
      ? `<a ${base} aria-label="${escapeHtml(aria)}" title="${escapeHtml(aria)}">${ic}</a>`
      : `<a ${base}>${ic}<span>${escapeHtml(added ? 'Agendado' : label)}</span></a>`;
  };
  document.addEventListener('click', e => {
    const a = e.target.closest && e.target.closest('a[data-cal-key]');
    if (!a) return;
    markCalAdded(a.dataset.calKey);
    a.classList.add('is-added');
    const svg = a.querySelector('svg'); if (svg) svg.outerHTML = icon('calCheck');
    const span = a.querySelector('span');
    if (span) span.textContent = 'Agendado';
    else { a.setAttribute('aria-label', ADDED_LABEL); a.setAttribute('title', ADDED_LABEL); }
  });

  const $ = id => document.getElementById(id);
  const log = (...args) => { if (location.search.includes('debug')) console.log('[hub]', ...args); };
  const logErr = (...args) => console.error('[hub]', ...args);

  const toISODate = dt =>
    `${dt.getFullYear()}-${String(dt.getMonth() + 1).padStart(2, '0')}-${String(dt.getDate()).padStart(2, '0')}`;
  const todayISO = () => toISODate(new Date());
  const isValidISODate = s => {
    if (typeof s !== 'string' || !/^\d{4}-\d{2}-\d{2}$/.test(s)) return false;
    const [y, m, d] = s.split('-').map(Number);
    const dt = new Date(y, m - 1, d);
    return dt.getFullYear() === y && dt.getMonth() === m - 1 && dt.getDate() === d;
  };
  const isValidTime = s => typeof s === 'string' && /^\d{2}:\d{2}$/.test(s) && (() => {
    const [h, m] = s.split(':').map(Number);
    return h >= 0 && h <= 23 && m >= 0 && m <= 59;
  })();
  const addDaysISO = (value, days) => {
    const [y, m, d] = value.split('-').map(Number);
    const dt = new Date(y, m - 1, d);
    dt.setDate(dt.getDate() + days);
    return toISODate(dt);
  };
  const dayDiff = (from, to) =>
    Math.round((new Date(to + 'T00:00:00') - new Date(from + 'T00:00:00')) / 86400000);
  const fmtDate = value => {
    if (!isValidISODate(value)) return '—';
    const [y, m, d] = value.split('-').map(Number);
    return new Date(y, m - 1, d).toLocaleDateString('es-AR', { day: 'numeric', month: 'short' });
  };
  const fmtDateLong = value => {
    if (!isValidISODate(value)) return '—';
    const [y, m, d] = value.split('-').map(Number);
    return new Date(y, m - 1, d).toLocaleDateString('es-AR', { day: 'numeric', month: 'long' });
  };
  const fmtDateFull = value => {
    if (!isValidISODate(value)) return '—';
    const [y, m, d] = value.split('-').map(Number);
    return new Date(y, m - 1, d).toLocaleDateString('es-AR', { weekday: 'short', day: 'numeric', month: 'short' });
  };
  const escapeHtml = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({
    '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
  }[c]));

  const systemPrefersDark = () =>
    window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
  const loadTheme = () => {
    try { const s = localStorage.getItem(THEME_KEY); if (s === 'light' || s === 'dark') return s; } catch (e) {}
    return systemPrefersDark() ? 'dark' : DEFAULT_THEME;
  };
  const saveTheme = theme => { try { localStorage.setItem(THEME_KEY, theme); } catch (e) {} };
  const applyTheme = theme => {
    document.documentElement.setAttribute('data-theme', theme);
    const meta = document.querySelector('meta[name="theme-color"]');
    if (meta) meta.setAttribute('content', theme === 'light' ? '#FBF5F3' : '#1A1416');
  };
  let currentTheme = loadTheme();
  applyTheme(currentTheme);
  const setTheme = theme => {
    currentTheme = theme === 'dark' ? 'dark' : 'light';
    applyTheme(currentTheme); saveTheme(currentTheme);
  };
  if (window.matchMedia) {
    const mq = window.matchMedia('(prefers-color-scheme: dark)');
    const onChange = e => {
      try { const s = localStorage.getItem(THEME_KEY); if (s === 'light' || s === 'dark') return; } catch (err) {}
      currentTheme = e.matches ? 'dark' : 'light';
      applyTheme(currentTheme);
    };
    if (mq.addEventListener) mq.addEventListener('change', onChange);
    else if (mq.addListener) mq.addListener(onChange);
  }

  const readLS = key => {
    try { const raw = localStorage.getItem(key); return raw ? JSON.parse(raw) : null; }
    catch (e) { return null; }
  };

  const normalizeApptStatus = a => {
    if (!a || typeof a !== 'object') return 'pending';
    if (a.status === 'pending' || a.status === 'attended' || a.status === 'no_show') return a.status;
    if (a.done === true) return 'attended';
    if (a.done === false) return 'pending';
    return 'pending';
  };

  const computeUnas = () => {
    const data = readLS(KEY_UNAS);
    if (!data || !Array.isArray(data.visits)) return { state: 'empty' };
    const settings = data.settings || {};
    const iH = Number(settings.handsInterval) || 3;
    const iF = Number(settings.feetInterval) || 5;
    const latest = { manos: null, pies: null };
    for (const v of data.visits) {
      if (!v || !['manos','pies'].includes(v.kind)) continue;
      if (!isValidISODate(v.date)) continue;
      if (!latest[v.kind] || v.date > latest[v.kind].date) latest[v.kind] = v;
    }
    const due = { manos: null, pies: null };
    if (latest.manos) due.manos = addDaysISO(latest.manos.date, iH * 7);
    if (latest.pies) due.pies = addDaysISO(latest.pies.date, iF * 7);
    let next = null;
    for (const kind of ['manos','pies']) if (due[kind] && (!next || due[kind] < next.date)) next = { kind, date: due[kind] };
    if (!next) return { state: 'empty' };
    const days = dayDiff(todayISO(), next.date);
    const total = (next.kind === 'manos' ? iH : iF) * 7;
    const lead = Number.isInteger(Number(settings.leadDays)) ? Number(settings.leadDays) : 3;
    const time = typeof settings.reminderTime === 'string' ? settings.reminderTime : '09:00';
    return { state: 'ok', kind: next.kind, date: next.date, days, total, lead, time };
  };
  /* Evento de calendario para pedir turno de uñas (unos días antes de la fecha estimada) */
  const unasCalEvent = (kind, dueDate, lead, time) => {
    let when = addDaysISO(dueDate, -(Number(lead) || 0));
    if (when < todayISO()) when = todayISO();
    return { title: `Pedir turno: uñas de ${kind}`, date: when, time: time || '09:00', details: `Fecha estimada para hacerte las uñas de ${kind}: ${fmtDateLong(dueDate)}. (Mi espacio)` };
  };
  const computeCiclo = () => {
    const data = readLS(KEY_CICLO);
    if (!data || !Array.isArray(data.periods)) return { state: 'empty' };
    const periods = data.periods
      .filter(p => p && isValidISODate(p.startDate))
      .sort((a, b) => a.startDate.localeCompare(b.startDate));
    if (!periods.length) return { state: 'empty' };
    const defCycle = Number((data.settings && data.settings.defaultCycleLength)) || 28;
    const diffs = [];
    for (let i = 1; i < periods.length; i++) {
      const d = dayDiff(periods[i - 1].startDate, periods[i].startDate);
      if (d >= 21 && d <= 45) diffs.push(d);
    }
    const avgCycle = diffs.length ? Math.round(diffs.reduce((a, b) => a + b, 0) / diffs.length) : defCycle;
    const ongoing = periods.find(p => !p.endDate);
    if (ongoing) return { state: 'ongoing', day: dayDiff(ongoing.startDate, todayISO()) + 1, date: ongoing.startDate };
    const last = periods[periods.length - 1];
    const nextStart = addDaysISO(last.startDate, avgCycle);
    const days = dayDiff(todayISO(), nextStart);
    const cycleDay = dayDiff(last.startDate, todayISO()) + 1;
    if (days < 0) return { state: 'overdue', days: -days, date: nextStart, cycleDay, avgCycle };
    if (days === 0) return { state: 'today', date: nextStart, cycleDay, avgCycle };
    return { state: 'ok', days, date: nextStart, cycleDay, avgCycle };
  };
  const computeTurnos = () => {
    const data = readLS(KEY_TURNOS);
    if (!data || !Array.isArray(data.appointments)) return { state: 'empty' };
    const up = data.appointments
      .filter(a => a && isValidISODate(a.date) && normalizeApptStatus(a) === 'pending' && a.date >= todayISO())
      .sort((a, b) => a.date.localeCompare(b.date) || (a.time || '').localeCompare(b.time || ''));
    if (!up.length) return { state: 'empty' };
    const n = up[0];
    return { state: 'ok', title: n.title || 'Turno', date: n.date, time: n.time, days: dayDiff(todayISO(), n.date) };
  };
  const computeRecordatorios = () => {
    const data = readLS(KEY_RECORDATORIOS);
    if (!data || !Array.isArray(data.reminders)) return { state: 'empty' };
    const pending = data.reminders.filter(r => r && isValidISODate(r.date) && !r.done);
    if (!pending.length) return { state: 'empty' };
    const overdue = pending.filter(r => r.date < todayISO()).length;
    const up = pending.filter(r => r.date >= todayISO()).sort((a, b) => a.date.localeCompare(b.date) || (a.time || '').localeCompare(b.time || ''));
    return { state: 'ok', count: pending.length, overdue, next: up[0] || null };
  };
  const computeEvents = () => {
    const events = [];
    const today = todayISO();
    const u = computeUnas();
    if (u.state === 'ok') {
      const date = u.date < today ? today : u.date;
      events.push({ view: 'unas', icon: 'nails', title: `Uñas de ${u.kind}`, date, late: u.date < today ? dayDiff(u.date, today) : 0, origDate: u.date, meta: u.date < today ? `Se pasó la fecha (${fmtDate(u.date)})` : 'Fecha estimada', cal: unasCalEvent(u.kind, u.date, u.lead, u.time) });
    }
    const c = computeCiclo();
    if (c.state === 'ok' || c.state === 'today' || c.state === 'overdue') {
      events.push({ view: 'ciclo', icon: 'drop', title: c.state === 'overdue' ? 'Período (atrasado)' : 'Próximo período', late: c.state === 'overdue' ? c.days : 0, origDate: c.date, date: c.state === 'overdue' ? today : c.date, meta: c.state === 'overdue' ? `Atraso de ${c.days} día${c.days === 1 ? '' : 's'}` : 'Fecha estimada', cal: c.state === 'overdue' ? null : { title: 'Período (estimado)', date: c.date, details: 'Fecha estimada por Mi espacio.' } });
    }
    const tD = readLS(KEY_TURNOS);
    if (tD && Array.isArray(tD.appointments)) {
      for (const a of tD.appointments) {
        if (!a || !isValidISODate(a.date) || a.date < today) continue;
        if (normalizeApptStatus(a) !== 'pending') continue;
        events.push({ view: 'turnos', icon: 'calendar', title: a.title || 'Turno', date: a.date, time: a.time, meta: a.place || 'Turno', cal: { title: a.title || 'Turno', date: a.date, time: a.time, location: a.place, details: a.notes } });
      }
    }
    const rD = readLS(KEY_RECORDATORIOS);
    if (rD && Array.isArray(rD.reminders)) {
      for (const r of rD.reminders) {
        if (!r || !isValidISODate(r.date) || r.done || r.date < today) continue;
        events.push({ view: 'recordatorios', icon: 'bell', title: r.title || 'Aviso', date: r.date, time: r.time, meta: 'Aviso', cal: { title: r.title || 'Aviso', date: r.date, time: r.time, details: r.notes } });
      }
    }
    events.sort((a, b) => a.date !== b.date ? a.date.localeCompare(b.date) : (a.time || '').localeCompare(b.time || ''));
    return events;
  };
  const computeAlerts = () => {
    const alerts = [];
    const c = computeCiclo();
    if (c.state === 'overdue' && c.days >= 3) alerts.push({ view: 'ciclo', icon: 'drop', text: `Tu período está ${c.days} días atrasado.`, danger: c.days >= 7 });
    const rD = readLS(KEY_RECORDATORIOS);
    if (rD && Array.isArray(rD.reminders)) {
      const v = rD.reminders.filter(r => r && isValidISODate(r.date) && !r.done && r.date < todayISO()).length;
      if (v > 0) alerts.push({ view: 'recordatorios', icon: 'bell', text: `Tenés ${v} aviso${v === 1 ? '' : 's'} vencido${v === 1 ? '' : 's'}.` });
    }
    const tD = readLS(KEY_TURNOS);
    if (tD && Array.isArray(tD.appointments)) {
      const t = tD.appointments.filter(a => a && isValidISODate(a.date) && a.date < todayISO() && normalizeApptStatus(a) === 'pending').length;
      if (t > 0) alerts.push({ view: 'turnos', icon: 'calendar', text: t === 1 ? 'Tenés 1 turno que ya pasó: marcá si fuiste.' : `Tenés ${t} turnos que ya pasaron: marcá si fuiste.` });
    }
    return alerts;
  };

  const parseHash = () => {
    const raw = (location.hash || '').replace(/^#\/?/, '').trim();
    if (!loadProfile().welcomed) return 'bienvenida';
    return VIEWS[raw] && raw !== 'bienvenida' ? raw : DEFAULT_VIEW;
  };
  const navigate = view => {
    if (!VIEWS[view]) view = DEFAULT_VIEW;
    const target = '#/' + view;
    if (location.hash !== target) location.hash = target;
    else renderView(view);
  };
  const onHashChange = () => renderView(parseHash());

  const renderNav = () => {
    const d = $('navDesktop'), m = $('navMobile');
    d.textContent = ''; m.textContent = '';
    for (const [key, v] of Object.entries(VIEWS)) {
      if (!v.nav) continue;
      const db = document.createElement('button');
      db.type = 'button'; db.dataset.view = key;
      db.innerHTML = `${icon(v.icon)}<span>${v.label}</span>`;
      db.addEventListener('click', () => navigate(key));
      d.appendChild(db);
      const mb = document.createElement('button');
      mb.type = 'button'; mb.dataset.view = key;
      mb.innerHTML = `${icon(v.icon)}<span class="nm-label">${v.label}</span>`;
      mb.addEventListener('click', () => navigate(key));
      m.appendChild(mb);
    }
  };
  const setActiveNav = view => {
    document.querySelectorAll('[data-view]').forEach(el => {
      if (el.tagName === 'BUTTON' && el.parentElement && (el.parentElement.id === 'navDesktop' || el.parentElement.id === 'navMobile')) {
        el.classList.toggle('active', el.dataset.view === view);
      }
    });
  };

  const viewHeader = ({ tag, title, subtitle, back, action }) => `
    <div class="page-head">
      <div class="${back ? 'back-row' : 'ph-text'}">
        ${back ? `<button type="button" class="icon-btn" data-action="go:${escapeHtml(back)}" aria-label="Volver">${icon('back')}</button>` : ''}
        <div class="ph-text">
          ${tag ? `<div class="tag">${escapeHtml(tag)}</div>` : ''}
          <h1>${escapeHtml(title)}</h1>
          ${subtitle ? `<p>${escapeHtml(subtitle)}</p>` : ''}
        </div>
      </div>
      ${action || ''}
    </div>
  `;
  const settingsBtn = () => `<button type="button" class="icon-btn" data-action="go:ajustes" aria-label="Ajustes">${icon('gear')}</button>`;
  const placeholder = ({ icon, title, description }) => `
    <div class="placeholder">
      <div class="ph-icon" aria-hidden="true">${icon}</div>
      <h2>${escapeHtml(title)}</h2>
      <p>${escapeHtml(description)}</p>
    </div>
  `;
  const renderSummaryCard = ({ view, icon: ic, label, value, sub, state, tone, progress }) => {
    const cls = state && state !== 'ok' ? `is-${state}` : '';
    const bar = typeof progress === 'number' ? `<div class="progress" style="height:6px"><span style="width:${Math.max(0, Math.min(100, progress))}%"></span></div>` : '';
    return `<div class="summary-card ${cls}" data-view="${escapeHtml(view)}" ${tone ? `data-tone="${escapeHtml(tone)}"` : ''} role="button" tabindex="0"><div class="sc-ico">${icon(ic)}</div><div class="sc-label">${escapeHtml(label)}</div><div class="sc-value">${escapeHtml(value)}</div>${sub ? `<div class="sc-sub">${escapeHtml(sub)}</div>` : ''}${bar}</div>`;
  };
  const whenLabel = date => {
    const d = dayDiff(todayISO(), date);
    if (d < 0) return `Hace ${-d} día${-d === 1 ? '' : 's'}`;
    if (d === 0) return 'HOY';
    if (d === 1) return 'MAÑANA';
    return `En ${d} días`;
  };

  let toastTimer = null;
  function showToast(msg, type = 'success', options = {}) {
    const el = $('toast');
    if (!el) return;
    el.textContent = '';
    const text = document.createElement('span');
    text.textContent = msg;
    el.appendChild(text);
    el.classList.toggle('error', type === 'error');
    if (options.action) {
      const btn = document.createElement('button');
      btn.className = 'toast-action';
      btn.type = 'button';
      btn.textContent = options.action.label;
      btn.addEventListener('click', () => {
        try { options.action.onClick && options.action.onClick(); } catch (e) { logErr(e); }
        el.classList.remove('show');
        clearTimeout(toastTimer);
      });
      el.appendChild(btn);
    }
    el.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => el.classList.remove('show'), options.duration || 3500);
  }
  window.__hubToast = showToast;

  const newId = () => {
    if (typeof crypto !== 'undefined' && typeof crypto.randomUUID === 'function') { try { return crypto.randomUUID(); } catch (e) {} }
    return 'x' + Date.now().toString(36) + Math.random().toString(36).slice(2, 10);
  };

  /* ==================== UÑAS ==================== */
  const unasModule = (() => {
    const DB_NAME = 'agendaUnasDB'; const DB_VERSION = 1; const PHOTO_STORE = 'photos';
    const MAX_PHOTOS_PER_KIND = 12; const NOTE_MAX = 120; const PHOTO_MAX_DIM = 900; const PHOTO_QUALITY = 0.75;
    const VALID_TIMES = ['09:00', '12:00', '18:00'];
    const DEFAULTS = () => ({ settings: { handsInterval: 3, feetInterval: 5, leadDays: 3, reminderTime: '09:00' }, visits: [] });
    let state = DEFAULTS();
    const photoCache = new Map();
    let pendingPhoto = null, pendingPhotoKind = null, saving = false;
    let dbPromise = null, dbSupported = 'indexedDB' in window, lsAvailable = true;
    let currentMountId = 0;
    try { const k = '__t__' + Math.random(); localStorage.setItem(k, '1'); localStorage.removeItem(k); }
    catch (e) { lsAvailable = false; }
    const toast = (msg, type, opts) => window.__hubToast ? window.__hubToast(msg, type, opts) : console.log(msg);

    const openDB = () => {
      if (dbPromise) return dbPromise;
      if (!dbSupported) return Promise.reject(new Error('no-idb'));
      dbPromise = new Promise((resolve, reject) => {
        let req;
        try { req = indexedDB.open(DB_NAME, DB_VERSION); }
        catch (e) { dbSupported = false; reject(e); return; }
        req.onupgradeneeded = () => {
          const db = req.result;
          if (!db.objectStoreNames.contains(PHOTO_STORE)) db.createObjectStore(PHOTO_STORE, { keyPath: 'visitId' });
        };
        req.onsuccess = () => resolve(req.result);
        req.onerror = () => { dbSupported = false; reject(req.error || new Error('idb')); };
        req.onblocked = () => reject(new Error('idb-blocked'));
      });
      return dbPromise;
    };
    const idbOp = (mode, fn) => new Promise((resolve, reject) => {
      openDB().then(db => {
        let t; try { t = db.transaction(PHOTO_STORE, mode); } catch (e) { reject(e); return; }
        let out; try { out = fn(t.objectStore(PHOTO_STORE)); } catch (e) { reject(e); return; }
        t.oncomplete = () => resolve(out && 'result' in out ? out.result : out);
        t.onerror = () => reject(t.error); t.onabort = () => reject(t.error);
      }).catch(reject);
    });
    const putPhoto = p => idbOp('readwrite', s => s.put(p));
    const deletePhoto = id => idbOp('readwrite', s => s.delete(id));
    const getAllPhotos = () => idbOp('readonly', s => s.getAll());
    const clearPhotos = () => idbOp('readwrite', s => s.clear());

    const loadImgFromFile = file => new Promise((resolve, reject) => {
      if (typeof FileReader === 'undefined') { reject(new Error('no-fr')); return; }
      const r = new FileReader();
      r.onload = () => { const img = new Image(); img.onload = () => resolve(img); img.onerror = () => reject(new Error('img')); img.src = r.result; };
      r.onerror = () => reject(new Error('read'));
      r.readAsDataURL(file);
    });
    const compressImage = async (file, maxDim = PHOTO_MAX_DIM, quality = PHOTO_QUALITY) => {
      const img = await loadImgFromFile(file);
      let w = img.naturalWidth || img.width, h = img.naturalHeight || img.height;
      if (!w || !h) throw new Error('dim');
      const ratio = Math.min(1, maxDim / Math.max(w, h));
      w = Math.max(1, Math.round(w * ratio)); h = Math.max(1, Math.round(h * ratio));
      const canvas = document.createElement('canvas');
      canvas.width = w; canvas.height = h;
      const ctx = canvas.getContext('2d');
      if (!ctx) throw new Error('canvas');
      ctx.drawImage(img, 0, 0, w, h);
      return canvas.toDataURL('image/jpeg', quality);
    };

    const sanitizeSettings = raw => {
      const out = { ...DEFAULTS().settings };
      if (!raw || typeof raw !== 'object') return out;
      const hi = Number(raw.handsInterval), fi = Number(raw.feetInterval), ld = Number(raw.leadDays);
      if (Number.isInteger(hi) && hi >= 1 && hi <= 52) out.handsInterval = hi;
      if (Number.isInteger(fi) && fi >= 1 && fi <= 52) out.feetInterval = fi;
      if (Number.isInteger(ld) && ld >= 0 && ld <= 30) out.leadDays = ld;
      if (typeof raw.reminderTime === 'string' && VALID_TIMES.includes(raw.reminderTime)) out.reminderTime = raw.reminderTime;
      return out;
    };
    const sanitizeVisit = v => {
      if (!v || typeof v !== 'object') return null;
      if (!['manos','pies'].includes(v.kind)) return null;
      if (!isValidISODate(v.date)) return null;
      return { id: (typeof v.id === 'string' && v.id) ? v.id : newId(), kind: v.kind, date: v.date, note: typeof v.note === 'string' ? v.note.trim().slice(0, NOTE_MAX) : '' };
    };
    const sanitizeState = raw => {
      const out = { settings: sanitizeSettings(raw && raw.settings), visits: [] };
      if (raw && Array.isArray(raw.visits)) {
        const seen = new Set();
        for (const v of raw.visits) {
          const c = sanitizeVisit(v);
          if (!c) continue;
          if (seen.has(c.id)) c.id = newId();
          seen.add(c.id); out.visits.push(c);
        }
      }
      return out;
    };
    const save = () => {
      if (!lsAvailable) { toast('Tu navegador bloquea el guardado.', 'error'); return false; }
      try { localStorage.setItem(KEY_UNAS, JSON.stringify({ version: 2, settings: state.settings, visits: state.visits })); return true; }
      catch (e) { toast('No se pudieron guardar los datos.', 'error'); return false; }
    };
    const load = () => {
      if (!lsAvailable) { state = DEFAULTS(); return; }
      try { const raw = localStorage.getItem(KEY_UNAS); if (raw) state = sanitizeState(JSON.parse(raw)); }
      catch (e) { state = DEFAULTS(); }
    };
    const interval = kind => Number(kind === 'manos' ? state.settings.handsInterval : state.settings.feetInterval) * 7;
    const latest = kind => state.visits.filter(v => v.kind === kind).sort((a, b) => b.date.localeCompare(a.date) || b.id.localeCompare(a.id))[0];
    const dueDate = kind => { const v = latest(kind); return v ? addDaysISO(v.date, interval(kind)) : ''; };
    const reminderText = kind => {
      const due = dueDate(kind);
      if (!due) return { text: 'Registrá la última visita', cls: '' };
      const delta = dayDiff(todayISO(), due);
      const lead = Number(state.settings.leadDays) || 0;
      const time = state.settings.reminderTime || '09:00';
      if (delta < 0) return { text: `Se pasó hace ${Math.abs(delta)} día${Math.abs(delta) === 1 ? '' : 's'}`, cls: 'overdue' };
      if (delta <= lead) return { text: delta === 0 ? `¡Toca pedir turno! · aviso ${time}` : `Aviso: faltan ${delta} día${delta === 1 ? '' : 's'} · ${time}`, cls: delta === 0 ? 'today' : 'warn' };
      return { text: `En ${delta} día${delta === 1 ? '' : 's'}`, cls: '' };
    };

  /* ==================== RECORDATORIOS ==================== */
  const recordatoriosModule = (() => {

    const sanitizeReminder = r => {
      if (!r || typeof r !== 'object') return null;
      if (!isValidISODate(r.date)) return null;
      const title = (typeof r.title === 'string' ? r.title : '').trim();
      if (!title) return null;
      const time = isValidTime(r.time) ? r.time : '';
      const notes = (typeof r.notes === 'string' ? r.notes : '').trim();
      return { id: (typeof r.id === 'string' && r.id) ? r.id : newId(), title, date: r.date, time, notes, done: !!r.done };
    };
    const sanitizeState = raw => {
      const out = { reminders: [] };
      if (raw && Array.isArray(raw.reminders)) {
        const seen = new Set();
        for (const r of raw.reminders) {
          const c = sanitizeReminder(r);
          if (!c) continue;
          if (seen.has(c.id)) c.id = newId();
          seen.add(c.id); out.reminders.push(c);
        }
      }
      return out;
    };
    const save = () => {
      if (!lsAvailable) { toast('Tu navegador bloquea el guardado.', 'error'); return false; }

      catch (e) { toast('No se pudieron guardar los datos.', 'error'); return false; }
    };
    const load = () => {
      if (!lsAvailable) return;

    const sortByDate = (a, b) => a.date !== b.date ? a.date.localeCompare(b.date) : (a.time || '99:99').localeCompare(b.time || '99:99');
    const pendientes = () => state.reminders.filter(r => !r.done).sort(sortByDate);
    const cumplidos = () => state.reminders.filter(r => r.done).sort((a, b) => sortByDate(b, a));
    const stats = () => ({

      if (!title) { toast('Poné un título.', 'error'); return false; }

      document.querySelectorAll('[data-rec-filter]').forEach(b => b.addEventListener('click', () => setFilter(b.dataset.recFilter)));
      const addBtn = $('recAdd');
      if (addBtn) addBtn.addEventListener('click', () => { if (addReminder()) resetForm(); });
      const exportBtn = $('recExportData');
      if (exportBtn) exportBtn.addEventListener('click', () => {
        try {
          const data = { app: 'hub-recordatorios', version: 1, exportedAt: new Date().toISOString(), reminders: state.reminders };
          const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
          const url = URL.createObjectURL(blob); const a = document.createElement('a');
          a.href = url; a.download = `recordatorios-${todayISO()}.json`;
          document.body.appendChild(a); a.click(); a.remove();
          setTimeout(() => URL.revokeObjectURL(url), 1000);
          toast('Copia exportada.');
        } catch (e) { toast('No se pudo exportar.', 'error'); }
      });
      const resetAllBtn = $('recResetData');
      if (resetAllBtn) resetAllBtn.addEventListener('click', () => {
        if (!window.confirm('¿Borrar todos los recordatorios?')) return;
        state = DEFAULTS(); save(); renderStatsCards(); renderList(); resetForm(); toast('Recordatorios borrados.');
      });
      const importBtn = $('recImportData'), importFile = $('recImportFile');
      if (importBtn && importFile) {
        importBtn.addEventListener('click', () => importFile.click());
        importFile.addEventListener('change', async e => {
          const f = e.target.files && e.target.files[0]; e.target.value = '';
          if (!f) return;
          if (!window.confirm('Restaurar la copia reemplazará todos los recordatorios. ¿Continuar?')) return;
          try {
            const raw = JSON.parse(await f.text());
            if (!raw || typeof raw !== 'object' || !Array.isArray(raw.reminders)) throw new Error('formato');
            state = sanitizeState(raw); if (!save()) return;
            renderStatsCards(); renderList(); toast('Copia restaurada.');
          } catch (err) { toast('No se pudo leer esa copia.', 'error'); }
        });
      }
    };
    return { mount };
  })();

  /* ==================== AJUSTES ==================== */
  const ajustesModule = (() => {
    const toast = (msg, type) => window.__hubToast ? window.__hubToast(msg, type) : console.log(msg);
    const readRaw = key => { try { return localStorage.getItem(key); } catch (e) { return null; } };
    const estimateBytes = s => (s ? new Blob([s]).size : 0);
    const fmtBytes = bytes => {
      if (bytes < 1024) return bytes + ' B';
      if (bytes < 1024 * 1024) return (bytes / 1024).toFixed(1) + ' KB';
      return (bytes / (1024 * 1024)).toFixed(2) + ' MB';
    };
    const computeCounts = () => {
      const unas = readLS(KEY_UNAS) || {};
      const ciclo = readLS(KEY_CICLO) || {};
      const turnos = readLS(KEY_TURNOS) || {};
      const recs = readLS(KEY_RECORDATORIOS) || {};
      return {
        unas: (unas.visits || []).length,
        ciclo: (ciclo.periods || []).length,
        turnos: (turnos.appointments || []).length,
        recs: (recs.reminders || []).length,
      };
    };
    const computeStorage = () => {
      const keys = [KEY_UNAS, KEY_CICLO, KEY_TURNOS, KEY_RECORDATORIOS, THEME_KEY, KEY_PERFIL];
      let total = 0;
      for (const k of keys) total += estimateBytes(readRaw(k));
      return total;
    };

    const renderOverview = () => {
      const el = $('ajustesOverview'); if (!el) return;
      const c = computeCounts();
      const totalBytes = computeStorage();
      const maxBytes = 5 * 1024 * 1024;
      const pct = Math.min(100, (totalBytes / maxBytes) * 100);
      el.innerHTML = `
        <div class="setting-row">
          <div class="sr-info">
            <div class="sr-title">Contenido actual</div>
            <div class="sr-desc">${c.unas} visitas de uñas · ${c.ciclo} períodos · ${c.turnos} turnos · ${c.recs} avisos</div>
          </div>
        </div>
        <div class="setting-row">
          <div class="sr-info" style="width:100%;">
            <div class="sr-title">Uso de almacenamiento</div>
            <div class="sr-desc">Los datos viven en este navegador. Estimado de localStorage.</div>
            <div class="storage-bar-wrap">
              <div class="storage-bar"><div class="storage-bar-fill" style="width:${pct}%"></div></div>
              <div class="storage-info"><span>${fmtBytes(totalBytes)} usados</span><span>límite típico ~5 MB</span></div>
            </div>
          </div>
        </div>
        <div class="setting-row">
          <div class="sr-info">
            <div class="sr-title">Versión</div>
            <div class="sr-desc">Compilación actual del hub</div>
          </div>
          <span class="version-badge">v${HUB_VERSION}</span>
        </div>
      `;
    };

    const doExportAll = async () => {
      try {
        const photos = await unasModule.exportPhotos();
        const bundle = {
          app: 'mi-espacio-hub',
          version: HUB_VERSION,
          exportedAt: new Date().toISOString(),
          theme: currentTheme,
          profile: loadProfile(),
          data: {
            unas: readLS(KEY_UNAS),
            ciclo: readLS(KEY_CICLO),
            turnos: readLS(KEY_TURNOS),
            recordatorios: readLS(KEY_RECORDATORIOS),
          },
          photos,
        };
        const blob = new Blob([JSON.stringify(bundle, null, 2)], { type: 'application/json' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url; a.download = `mi-espacio-backup-${todayISO()}.json`;
        document.body.appendChild(a); a.click(); a.remove();
        setTimeout(() => URL.revokeObjectURL(url), 1000);
        toast('Copia completa exportada.');
      } catch (e) { toast('No se pudo exportar.', 'error'); }
    };

    const doImportAll = async file => {
      try {
        const raw = JSON.parse(await file.text());
        if (!raw || typeof raw !== 'object') throw new Error('formato');
        const data = raw.data || raw;
        const hasAny = ['unas', 'ciclo', 'turnos', 'recordatorios'].some(k => data[k]);
        if (!hasAny) throw new Error('sin-secciones');
        const backup = {
          [KEY_UNAS]: readRaw(KEY_UNAS),
          [KEY_CICLO]: readRaw(KEY_CICLO),
          [KEY_TURNOS]: readRaw(KEY_TURNOS),
          [KEY_RECORDATORIOS]: readRaw(KEY_RECORDATORIOS),
        };
        let restoredCount = 0;
        for (const [key, val] of Object.entries({
          [KEY_UNAS]: data.unas,
          [KEY_CICLO]: data.ciclo,
          [KEY_TURNOS]: data.turnos,
          [KEY_RECORDATORIOS]: data.recordatorios,
        })) {
          if (val && typeof val === 'object') {
            try { localStorage.setItem(key, JSON.stringify(val)); restoredCount++; }
            catch (e) { logErr('import write', key, e); }
          }
        }
        if (restoredCount === 0) {
          for (const [k, v] of Object.entries(backup)) {
            if (v !== null) try { localStorage.setItem(k, v); } catch (e) {}
          }
          throw new Error('nada-restaurado');
        }
        if (typeof raw.theme === 'string' && (raw.theme === 'light' || raw.theme === 'dark')) setTheme(raw.theme);
        if (raw.profile && typeof raw.profile === 'object') saveProfile({ name: typeof raw.profile.name === 'string' ? raw.profile.name : '', welcomed: true });
        let photosCount = 0;
        if (Array.isArray(raw.photos)) photosCount = await unasModule.importPhotos(raw.photos);
        renderView('ajustes');
        toast(`Copia restaurada (${restoredCount} sección${restoredCount === 1 ? '' : 'es'}${photosCount ? `, ${photosCount} foto${photosCount === 1 ? '' : 's'}` : ''}).`);
      } catch (err) {
        logErr('import-all', err);
        toast('No se pudo restaurar esa copia.', 'error');
      }
    };

    const doResetAll = async () => {
      const answer = window.prompt('Esto borra TODOS los datos (uñas, fotos, ciclo, turnos y avisos). Escribí BORRAR para confirmar.');
      if (answer === null) return;
      if (answer.trim().toUpperCase() !== 'BORRAR') { toast('No se borró nada.', 'error'); return; }
      try {
        localStorage.removeItem(KEY_UNAS);
        localStorage.removeItem(KEY_CICLO);
        localStorage.removeItem(KEY_TURNOS);
        localStorage.removeItem(KEY_RECORDATORIOS);
        localStorage.removeItem(KEY_CAL);
        await unasModule.resetPhotos();
        renderOverview();
        toast('Todos los datos borrados.');
      } catch (e) { toast('No se pudo completar el borrado.', 'error'); }
    };

    const renderThemeButtons = () => {
      document.querySelectorAll('[data-set-theme]').forEach(b => {
        const on = b.dataset.setTheme === currentTheme;
        b.classList.toggle('active', on); b.setAttribute('aria-pressed', on ? 'true' : 'false');
      });
    };

    const mount = () => {
      renderOverview();
      const nameInp = $('ajustesName'), preview = $('ajustesGreetPreview');
      if (nameInp) {
        nameInp.value = loadProfile().name;
        const upd = () => { if (preview) preview.textContent = greetingFor(nameInp.value); };
        upd();
        nameInp.addEventListener('input', upd);
        const saveName = () => { if (saveProfile({ name: nameInp.value, welcomed: true })) toast('Nombre guardado.'); else toast('No se pudo guardar.', 'error'); };
        const nameBtn = $('ajustesSaveName');
        if (nameBtn) nameBtn.addEventListener('click', saveName);
        nameInp.addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); saveName(); } });
      }
      renderThemeButtons();
      document.querySelectorAll('[data-set-theme]').forEach(b => b.addEventListener('click', () => { setTheme(b.dataset.setTheme); renderThemeButtons(); }));
      const exportBtn = $('ajustesExportAll');
      if (exportBtn) exportBtn.addEventListener('click', doExportAll);
      const importBtn = $('ajustesImportAll'), importFile = $('ajustesImportFile');
      if (importBtn && importFile) {
        importBtn.addEventListener('click', () => importFile.click());
        importFile.addEventListener('change', async e => {
          const f = e.target.files && e.target.files[0]; e.target.value = '';
          if (!f) return;
          if (!window.confirm('Restaurar la copia completa reemplazará los datos de las secciones incluidas. ¿Continuar?')) return;
          await doImportAll(f);
        });
      }
      const resetBtn = $('ajustesResetAll');
      if (resetBtn) resetBtn.addEventListener('click', doResetAll);
    };
    return { mount };
  })();

  /* VISTAS */
  const fold = ({ id, title, ico, open, body }) => `
    <details class="fold" ${id ? `id="${id}"` : ''} ${open ? 'open' : ''}>
      <summary><span class="sum-left">${ico ? icon(ico) : ''}${escapeHtml(title)}</span>${icon('chevron', 'chev')}</summary>

  const dataFold = prefix => fold({ title: 'Copia y datos de esta sección', ico: 'download', body: `
    <p>Todo se guarda en este celular. Para una copia completa (con fotos) usá Ajustes.</p>
    <div class="actions">
      <button class="btn btn-ghost btn-sm" id="${prefix}ExportData" type="button">Exportar copia</button>
      <button class="btn btn-ghost btn-sm" id="${prefix}ImportData" type="button">Restaurar copia</button>
      <button class="btn btn-danger btn-sm" id="${prefix}ResetData" type="button">Borrar todo</button>
    </div>
    <input id="${prefix}ImportFile" type="file" accept="application/json,.json" hidden>` });

  const views = {

          <h1>Bienvenida a Mi espacio</h1>
          <p class="w-lead">Uñas, ciclo, turnos y avisos en un solo lugar. Todo queda guardado en tu celular.</p>
        </div>
        <div>
          <label for="welcomeName">¿Cómo te llamás?</label>

          <div class="field-hint">Lo usamos solo para saludarte. Podés cambiarlo en Ajustes.</div>
        </div>
        <div class="w-preview"><span>Así te va a saludar</span><strong id="welcomePreview">Hola</strong></div>
        <div class="w-actions">
          <button class="btn btn-primary" id="welcomeStart" type="button">Empezar</button>
          <button class="btn" id="welcomeSkip" type="button" style="color: var(--muted)">Ahora no</button>
        </div>
      </div>
    `,

    inicio: () => {

      const hasAny = [unas, ciclo, turnos, recs].some(s => s.state !== 'empty');
      const now = new Date();
      const days = ['domingo','lunes','martes','miércoles','jueves','viernes','sábado'];
      const months = ['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
      const dateLine = `${days[now.getDay()]} ${now.getDate()} de ${months[now.getMonth()]}`;
      const today = todayISO();

      let unasCard;
      if (unas.state === 'empty') unasCard = { view: 'unas', icon: 'nails', label: 'Uñas', value: 'Sin datos', sub: 'Registrá la última vez', state: 'empty' };
      else {
        const pct = Math.round(((unas.total - unas.days) / unas.total) * 100);
        if (unas.days < 0) unasCard = { view: 'unas', icon: 'nails', label: 'Uñas', value: `Pasada ${-unas.days} día${-unas.days === 1 ? '' : 's'}`, sub: `De ${unas.kind}`, state: 'warn', progress: 100 };
        else if (unas.days === 0) unasCard = { view: 'unas', icon: 'nails', label: 'Uñas', value: '¡Hoy!', sub: `De ${unas.kind}`, state: 'today', progress: 100 };
        else unasCard = { view: 'unas', icon: 'nails', label: 'Uñas', value: `En ${unas.days} día${unas.days === 1 ? '' : 's'}`, sub: `De ${unas.kind} · ${fmtDate(unas.date)}`, state: 'ok', progress: pct };
      }
      let cicloCard;
      if (ciclo.state === 'empty') cicloCard = { view: 'ciclo', icon: 'drop', label: 'Ciclo', value: 'Sin datos', sub: 'Cargá tu período', state: 'empty', tone: 'ciclo' };
      else if (ciclo.state === 'ongoing') cicloCard = { view: 'ciclo', icon: 'drop', label: 'Ciclo', value: `Período · día ${ciclo.day}`, sub: `Desde ${fmtDate(ciclo.date)}`, state: 'today', tone: 'ciclo' };
      else if (ciclo.state === 'overdue') cicloCard = { view: 'ciclo', icon: 'drop', label: 'Ciclo', value: `${ciclo.days} día${ciclo.days === 1 ? '' : 's'} de atraso`, sub: `Esperado ${fmtDate(ciclo.date)}`, state: 'overdue', tone: 'ciclo' };
      else if (ciclo.state === 'today') cicloCard = { view: 'ciclo', icon: 'drop', label: 'Ciclo', value: `Día ${ciclo.cycleDay}`, sub: 'Período esperado hoy', state: 'today', tone: 'ciclo' };
      else cicloCard = { view: 'ciclo', icon: 'drop', label: 'Ciclo', value: `Día ${ciclo.cycleDay}`, sub: `Período en ${ciclo.days} día${ciclo.days === 1 ? '' : 's'}`, state: 'ok', tone: 'ciclo' };
      let turnosCard;
      if (turnos.state === 'empty') turnosCard = { view: 'turnos', icon: 'calendar', label: 'Turnos', value: 'Ninguno', sub: 'Agregá un turno', state: 'empty', tone: 'turnos' };
      else turnosCard = { view: 'turnos', icon: 'calendar', label: 'Turnos', value: turnos.title, sub: `${turnos.days === 0 ? 'Hoy' : turnos.days === 1 ? 'Mañana' : fmtDateFull(turnos.date)}${turnos.time ? ' · ' + turnos.time : ''}`, state: turnos.days === 0 ? 'today' : 'ok', tone: 'turnos' };
      let recsCard;
      if (recs.state === 'empty') recsCard = { view: 'recordatorios', icon: 'bell', label: 'Avisos', value: 'Ninguno', sub: 'Creá un aviso', state: 'empty', tone: 'avisos' };
      else if (recs.overdue > 0) recsCard = { view: 'recordatorios', icon: 'bell', label: 'Avisos', value: `${recs.overdue} vencido${recs.overdue === 1 ? '' : 's'}`, sub: `${recs.count} pendiente${recs.count === 1 ? '' : 's'}`, state: 'overdue', tone: 'avisos' };
      else {
        const forToday = recs.next && recs.next.date === today;
        recsCard = { view: 'recordatorios', icon: 'bell', label: 'Avisos', value: `${recs.count} pendiente${recs.count === 1 ? '' : 's'}`, sub: forToday ? 'Hay uno para hoy' : (recs.next ? `Próximo: ${fmtDate(recs.next.date)}` : ''), state: forToday ? 'warn' : 'ok', tone: 'avisos' };
      }

      const alertsHtml = alerts.map(a => `<div class="alert-banner ${a.danger ? 'danger' : ''}" data-view="${escapeHtml(a.view)}" role="button" tabindex="0"><span class="ab-icon">${icon(a.icon)}</span><span style="flex:1">${escapeHtml(a.text)}</span>${icon('chevron')}</div>`).join('');

      let heroHtml = '';
      const first = events[0];
      if (first) {
        const d = dayDiff(today, first.date);
        const when = first.late ? `Se pasó hace ${first.late} día${first.late === 1 ? '' : 's'}` : (d === 0 ? 'Hoy' : d === 1 ? 'Mañana' : `En ${d} días`);
        heroHtml = `<div class="hero">

        }).join('')}</div>`;
      }

      let emptyHtml = '';
      if (!hasAny) {
        emptyHtml = `<div class="empty-dashboard"><h2>Empecemos</h2><p>Elegí por dónde arrancar. Todo queda guardado en tu celular.</p><div class="empty-shortcuts"><button type="button" data-view="unas"><span class="es-ico">${icon('nails')}</span><span>Uñas</span></button><button type="button" data-view="ciclo"><span class="es-ico">${icon('drop')}</span><span>Ciclo</span></button><button type="button" data-view="turnos"><span class="es-ico">${icon('calendar')}</span><span>Turnos</span></button><button type="button" data-view="recordatorios"><span class="es-ico">${icon('bell')}</span><span>Avisos</span></button></div></div>`;
      }

      return `
        <div class="page-head"><div class="ph-text"><div class="tag cap">${escapeHtml(dateLine)}</div><h1>${escapeHtml(greetingFor(loadProfile().name))}</h1></div>${settingsBtn()}</div>

        ${heroHtml}
        ${hasAny ? `<div class="summary-grid">
          ${renderSummaryCard(unasCard)}

          ${renderSummaryCard(turnosCard)}

        ${eventsHtml}

    },

    unas: () => `

            </div>
          </div>
        </div>
        <div class="actions"><button class="btn btn-primary btn-block" id="unasSaveVisit" type="button">Guardar</button></div>` })}
      ${fold({ title: 'Historial de visitas', ico: 'list', body: `<div id="unasHistory"></div>` })}
      ${fold({ title: 'Cada cuánto y cuándo avisar', ico: 'clock', body: `
        <div class="form-grid">

          <div><label for="unasFeetInterval">Pies: cada (semanas)</label><input id="unasFeetInterval" type="number" inputmode="numeric" min="1" max="52" step="1" value="5"></div>
          <div><label for="unasLeadDays">Avisar antes (días)</label><input id="unasLeadDays" type="number" inputmode="numeric" min="0" max="30" step="1" value="3"></div>

        </div>
        <div class="field-hint">El botón de calendario agenda "Pedir turno" esos días antes, a esa hora.</div>
        <div class="actions"><button class="btn btn-secondary" id="unasSaveSettings" type="button">Guardar</button></div>` })}
      ${dataFold('unas')}
      <input id="unasQuickPhoto" type="file" accept="image/*" hidden>
      <div id="unasLightbox" class="lightbox" hidden><button type="button" class="lightbox-close" id="unasLightboxClose" aria-label="Cerrar">×</button><img id="unasLightboxImg" alt=""></div>
    `,

    ciclo: () => `
      ${viewHeader({ title: 'Mi ciclo' })}
      <div id="cicloHero" class="cycle-hero"></div>
