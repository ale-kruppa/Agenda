        <div class="form-grid">
          <div><label for="cicloStartDate">Inicio</label><input id="cicloStartDate" type="date"></div>
          <div><label for="cicloEndDate">Fin (opcional)</label><input id="cicloEndDate" type="date"><div class="field-hint">Dejalo vacío si sigue en curso.</div></div>
        </div>
        <div class="actions"><button class="btn btn-primary" id="cicloAddPeriod" type="button">Guardar período</button></div>
      </div>
      <div class="panel"><h2>Historial</h2><p>Del más reciente al más antiguo.</p><div id="cicloHistory"></div></div>
      <div class="panel"><h2>Estadísticas</h2><div id="cicloStats" class="stats-grid"></div></div>
      <div class="panel">
        <h2>Configuración</h2>
        <p>Estos valores se usan cuando no hay suficientes ciclos registrados para calcular un promedio.</p>
        <div class="form-grid">
          <div><label for="cicloDefaultCycleLength">Duración del ciclo (días)</label><input id="cicloDefaultCycleLength" type="number" min="21" max="45" step="1" value="28"></div>
          <div><label for="cicloDefaultPeriodLength">Duración del período (días)</label><input id="cicloDefaultPeriodLength" type="number" min="1" max="15" step="1" value="5"></div>
          <div><label for="cicloLutealPhase">Fase lútea (días)</label><input id="cicloLutealPhase" type="number" min="9" max="17" step="1" value="14"></div>
        </div>
        <div class="actions"><button class="btn btn-secondary" id="cicloSaveSettings" type="button">Guardar configuración</button></div>
      </div>
      <div class="panel">
        <h2>Datos</h2>
        <p>Todo se guarda en este navegador. Exportá una copia para no perderlo.</p>
        <div class="actions">
          <button class="btn btn-ghost" id="cicloExportData" type="button">Exportar copia</button>
          <button class="btn btn-ghost" id="cicloImportData" type="button">Restaurar copia</button>
          <button class="btn btn-ghost" id="cicloResetData" type="button">Borrar todo</button>
        </div>
        <input id="cicloImportFile" type="file" accept="application/json" hidden>
        <div class="field-hint" style="margin-top:12px;">Esta app no reemplaza la consulta médica. Las estimaciones de ovulación y ventana fértil son aproximadas y no deben usarse como método anticonceptivo.</div>
      </div>
    `,

    turnos: () => `
      ${viewHeader({ tag: 'Sección', title: '📅 Turnos', subtitle: 'Médicos, dentista, peluquería: todo lo que tenga fecha.' })}
      <div id="turnosStats" class="summary-grid"></div>
      <div class="panel">
        <h2>Agregar un turno</h2>
        <p>Completá los datos. El título y la fecha son obligatorios.</p>
        <div class="form-grid">
          <div class="full"><label for="turnosTitle">Título <span class="required">*</span></label><input id="turnosTitle" type="text" placeholder="Ej: Dentista" maxlength="80"></div>
          <div><label for="turnosDate">Fecha <span class="required">*</span></label><input id="turnosDate" type="date"></div>
          <div><label for="turnosTime">Hora (opcional)</label><input id="turnosTime" type="time"></div>
          <div class="full"><label for="turnosPlace">Lugar (opcional)</label><input id="turnosPlace" type="text" placeholder="Ej: Clínica del Sol" maxlength="100"></div>
          <div class="full"><label for="turnosNotes">Notas (opcional)</label><textarea id="turnosNotes" placeholder="Cosas para recordar: llevar estudios, ayuno, etc." maxlength="500"></textarea></div>
        </div>
        <div class="actions"><button class="btn btn-primary" id="turnosAdd" type="button">Agregar turno</button></div>
      </div>
      <div class="panel">
        <h2>Lista de turnos</h2>
        <div class="filter-tabs">
          <button type="button" data-filter="proximos" class="active">Próximos</button>
          <button type="button" data-filter="cerrados">Cerrados</button>
        </div>
        <div id="turnosList" class="appt-list"></div>
      </div>
      <div class="panel">
        <h2>Datos</h2>
        <p>Todo se guarda en este navegador. Exportá una copia para no perderlo.</p>
        <div class="actions">
          <button class="btn btn-ghost" id="turnosExportData" type="button">Exportar copia</button>
          <button class="btn btn-ghost" id="turnosImportData" type="button">Restaurar copia</button>
          <button class="btn btn-ghost" id="turnosResetData" type="button">Borrar todo</button>
        </div>
        <input id="turnosImportFile" type="file" accept="application/json" hidden>
      </div>
    `,

    recordatorios: () => `
      ${viewHeader({ tag: 'Sección', title: '🔔 Recordatorios', subtitle: 'Tareas con fecha para no olvidarte de nada. Cuando las cumplís, quedan cerradas.' })}
      <div id="recStats" class="summary-grid"></div>
      <div class="panel">
        <h2>Agregar un recordatorio</h2>
        <p>El título y la fecha son obligatorios. La hora y las notas son opcionales.</p>
        <div class="form-grid">
          <div class="full"><label for="recTitle">Título <span class="required">*</span></label><input id="recTitle" type="text" placeholder="Ej: Llamar al plomero" maxlength="100"></div>
          <div><label for="recDate">Fecha <span class="required">*</span></label><input id="recDate" type="date"></div>
          <div><label for="recTime">Hora (opcional)</label><input id="recTime" type="time"></div>
          <div class="full"><label for="recNotes">Notas (opcional)</label><textarea id="recNotes" placeholder="Detalles para no olvidar" maxlength="500"></textarea></div>
        </div>
        <div class="actions"><button class="btn btn-primary" id="recAdd" type="button">Agregar recordatorio</button></div>
      </div>
      <div class="panel">
        <h2>Lista de recordatorios</h2>
        <div class="filter-tabs">
          <button type="button" data-rec-filter="pendientes" class="active">Pendientes</button>
          <button type="button" data-rec-filter="cumplidos">Cumplidos</button>
        </div>
        <div id="recList" class="reminder-list"></div>
      </div>
      <div class="panel">
        <h2>Datos</h2>
        <p>Todo se guarda en este navegador. Exportá una copia para no perderlo.</p>
        <div class="actions">
          <button class="btn btn-ghost" id="recExportData" type="button">Exportar copia</button>
          <button class="btn btn-ghost" id="recImportData" type="button">Restaurar copia</button>
          <button class="btn btn-ghost" id="recResetData" type="button">Borrar todo</button>
        </div>
        <input id="recImportFile" type="file" accept="application/json" hidden>
      </div>
    `,

    ajustes: () => `
      ${viewHeader({ tag: 'Sección', title: '⚙️ Ajustes', subtitle: 'Configuración general, gestión de datos y respaldo completo.' })}
      <div class="panel">
        <h2>Resumen</h2>
        <div id="ajustesOverview" class="settings-list"></div>
      </div>
      <div class="panel">
        <h2>Apariencia</h2>
        <div class="settings-list">
          <div class="setting-row">
            <div class="sr-info">
              <div class="sr-title">Tema</div>
              <div class="sr-desc">Alterná entre oscuro y claro. También podés hacerlo desde el ícono del header.</div>
            </div>
            <div class="sr-action"><button class="btn btn-secondary btn-sm" id="ajustesThemeToggle" type="button">Cambiar tema</button></div>
          </div>
        </div>
      </div>
      <div class="panel">
        <h2>Respaldo completo</h2>
        <p>Exportá todo el hub (uñas, ciclo, turnos, recordatorios) en un solo archivo. Restaurar reemplaza las secciones incluidas en la copia.</p>
        <div class="settings-list">
          <div class="setting-row">
            <div class="sr-info"><div class="sr-title">Exportar todo</div><div class="sr-desc">Un único JSON con todas las secciones. Ideal para llevar a otro dispositivo.</div></div>
            <div class="sr-action"><button class="btn btn-primary btn-sm" id="ajustesExportAll" type="button">Exportar</button></div>
          </div>
          <div class="setting-row">
            <div class="sr-info"><div class="sr-title">Restaurar todo</div><div class="sr-desc">Cargá una copia completa. Se conserva el tema si viene en el archivo.</div></div>
            <div class="sr-action"><button class="btn btn-secondary btn-sm" id="ajustesImportAll" type="button">Restaurar</button></div>
          </div>
        </div>
        <input id="ajustesImportFile" type="file" accept="application/json" hidden>
      </div>
      <div class="panel">
        <h2>Zona de peligro</h2>
        <div class="danger-zone">
          <div class="dz-title">Borrar todos los datos</div>
          <div class="dz-desc">Se eliminan las 4 secciones y las fotos asociadas en este dispositivo. El tema se conserva. Esta acción no se puede deshacer.</div>
          <button class="btn btn-danger btn-sm" id="ajustesResetAll" type="button">Borrar todo</button>
        </div>
      </div>
      <div class="panel">
        <h2>Acerca de</h2>
        <p>Mi espacio es un hub local sin servidores. Todo queda guardado en este navegador. El respaldo completo es tu seguro contra cualquier pérdida.</p>
      </div>
    `,
  };

  const viewMounts = {
    unas: () => unasModule.mount(),
    ciclo: () => cicloModule.mount(),
    turnos: () => turnosModule.mount(),
    recordatorios: () => recordatoriosModule.mount(),
    ajustes: () => ajustesModule.mount(),
  };

  const renderView = view => {
    if (!VIEWS[view]) view = DEFAULT_VIEW;
    const main = $('view');
    try {
      main.innerHTML = `<div class="view-enter">${views[view]()}</div>`;
    } catch (e) {
      logErr('renderView', e);
      main.innerHTML = `<div class="view-enter"><div class="placeholder"><h2>Algo se rompió</h2><p>${escapeHtml(e.message || '')}</p></div></div>`;
    }
    setActiveNav(view);
    document.title = VIEWS[view].title + ' · Mi espacio';
    main.querySelectorAll('[data-view]').forEach(el => {
      if (el.tagName !== 'BUTTON') {
        el.addEventListener('click', () => navigate(el.dataset.view));
        el.addEventListener('keydown', ev => {
          if (ev.key === 'Enter' || ev.key === ' ') { ev.preventDefault(); navigate(el.dataset.view); }
        });
      } else if (el.parentElement && el.parentElement.classList.contains('empty-shortcuts')) {
        el.addEventListener('click', () => navigate(el.dataset.view));
      }
    });
    main.querySelectorAll('[data-action]').forEach(btn => {
      btn.addEventListener('click', () => {
        const act = btn.dataset.action;
        if (act.startsWith('go:')) navigate(act.slice(3));
      });
    });
    if (typeof viewMounts[view] === 'function') {
      try { viewMounts[view](); } catch (e) { logErr('mount ' + view, e); }
    }
    try { main.focus({ preventScroll: true }); } catch (e) {}
    window.scrollTo(0, 0);
  };

  const init = () => {
    renderNav();
    $('themeToggle').addEventListener('click', toggleTheme);
    $('brand').addEventListener('click', () => navigate('inicio'));
    $('brand').addEventListener('keydown', e => {
      if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); navigate('inicio'); }
    });
    document.addEventListener('keydown', e => {
      if (e.key === 'Escape') {
        const editingForm = document.querySelector('.edit-form');
        if (editingForm) {
          const cancelBtn = editingForm.querySelector('[data-cancel-edit]');
          if (cancelBtn) { e.preventDefault(); cancelBtn.click(); }
        }
      }
    });
    window.addEventListener('hashchange', onHashChange);
    onHashChange();
  };

  init();

  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('./sw.js').catch(e => console.log('SW reg failed', e));
    });
  }
})();
</script>
</body>
</html>
