          <div class="phase-legend">
            <span><span class="dot menstrual"></span> Período</span>
            <span><span class="dot follicular"></span> Folicular</span>
            <span><span class="dot fertile"></span> Fértil</span>
            <span><span class="dot luteal"></span> Lútea</span>
          </div>
          <div id="cicloPhaseTodayLabel" class="phase-today-label"></div>
        </div>
      </div>
      <div id="cicloSummary" class="summary-grid" style="margin-top:14px"></div>
      ${fold({ title: 'Historial', ico: 'list', body: `<div id="cicloHistory"></div>` })}
      ${fold({ title: 'Estadísticas', ico: 'hourglass', body: `<div id="cicloStats" class="stats-grid"></div>` })}
      ${fold({ title: 'Cargar un período pasado', ico: 'plus', body: `
        <p>Para el día a día usá el botón de arriba. Esto es para cargar fechas viejas o corregir.</p>
        <div class="form-grid">
          <div><label for="cicloStartDate">Inicio</label><input id="cicloStartDate" type="date"></div>
          <div><label for="cicloEndDate">Fin (opcional)</label><input id="cicloEndDate" type="date"><div class="field-hint">Vacío si sigue en curso.</div></div>
        </div>
        <div class="actions"><button class="btn btn-primary" id="cicloAddPeriod" type="button">Guardar período</button></div>` })}
      ${fold({ title: 'Configuración', ico: 'gear', body: `
        <p>Se usan mientras no haya suficientes ciclos cargados para sacar un promedio.</p>
        <div class="form-grid">
          <div><label for="cicloDefaultCycleLength">Ciclo (días)</label><input id="cicloDefaultCycleLength" type="number" inputmode="numeric" min="21" max="45" step="1" value="28"></div>
          <div><label for="cicloDefaultPeriodLength">Período (días)</label><input id="cicloDefaultPeriodLength" type="number" inputmode="numeric" min="1" max="15" step="1" value="5"></div>
          <div><label for="cicloLutealPhase">Fase lútea (días)</label><input id="cicloLutealPhase" type="number" inputmode="numeric" min="9" max="17" step="1" value="14"></div>
        </div>
        <div class="actions"><button class="btn btn-secondary" id="cicloSaveSettings" type="button">Guardar</button></div>` })}
      ${dataFold('ciclo')}
      <div class="field-hint" style="margin-top:14px;">Las fechas son estimadas. No sirve como método anticonceptivo ni reemplaza la consulta médica.</div>
    `,

    turnos: () => `
      ${viewHeader({ title: 'Turnos', subtitle: 'Médicos, dentista, peluquería: todo lo que tenga fecha.' })}
      <div id="turnosStats" class="summary-grid"></div>
      ${fold({ id: 'turnosFormFold', title: 'Agregar un turno', ico: 'plus', body: `
        <div class="form-grid">
          <div class="full"><label for="turnosTitle">Qué es <span class="required">*</span></label><input id="turnosTitle" type="text" placeholder="Ej: Dentista" maxlength="80"></div>
          <div><label for="turnosDate">Fecha <span class="required">*</span></label><input id="turnosDate" type="date"></div>
          <div><label for="turnosTime">Hora</label><input id="turnosTime" type="time"></div>
          <div class="full"><label for="turnosPlace">Lugar</label><input id="turnosPlace" type="text" placeholder="Ej: Consultorio" maxlength="100"></div>
          <div class="full"><label for="turnosNotes">Notas</label><textarea id="turnosNotes" placeholder="Llevar estudios, ayuno, etc." maxlength="500"></textarea></div>
        </div>
        <div class="actions"><button class="btn btn-primary btn-block" id="turnosAdd" type="button">Agregar turno</button></div>` })}
      <div class="list-block">
        <div class="filter-tabs">
          <button type="button" data-filter="proximos" class="active">Próximos</button>
          <button type="button" data-filter="cerrados">Pasados</button>
        </div>
        <div id="turnosList" class="appt-list"></div>
      </div>
      ${dataFold('turnos')}
    `,

    recordatorios: () => `
      ${viewHeader({ title: 'Avisos', subtitle: 'Cosas para no olvidarte. Cuando las hacés, las tildás.' })}
      <div id="recStats" class="summary-grid"></div>
      ${fold({ id: 'recFormFold', title: 'Agregar un aviso', ico: 'plus', body: `
        <div class="form-grid">
          <div class="full"><label for="recTitle">Qué hay que hacer <span class="required">*</span></label><input id="recTitle" type="text" placeholder="Ej: Comprar acetona" maxlength="100"></div>
          <div><label for="recDate">Fecha <span class="required">*</span></label><input id="recDate" type="date"></div>
          <div><label for="recTime">Hora</label><input id="recTime" type="time"></div>
          <div class="full"><label for="recNotes">Notas</label><textarea id="recNotes" placeholder="Detalles" maxlength="500"></textarea></div>
        </div>
        <div class="actions"><button class="btn btn-primary btn-block" id="recAdd" type="button">Agregar aviso</button></div>` })}
      <div class="list-block">
        <div class="filter-tabs">
          <button type="button" data-rec-filter="pendientes" class="active">Pendientes</button>
          <button type="button" data-rec-filter="cumplidos">Hechos</button>
        </div>
        <div id="recList" class="reminder-list"></div>
      </div>
      ${dataFold('rec')}
    `,

    ajustes: () => `
      ${viewHeader({ title: 'Ajustes', back: 'inicio' })}
      <div class="panel">
        <label for="ajustesName">Tu nombre</label>
        <div style="display:flex; gap:10px;">
          <input id="ajustesName" type="text" placeholder="Tu nombre" maxlength="30" autocomplete="given-name">
          <button class="btn btn-primary" id="ajustesSaveName" type="button">Guardar</button>
        </div>
        <div class="greet-preview">En Inicio vas a ver: <strong id="ajustesGreetPreview">Hola</strong></div>
      </div>
      <div class="panel">
        <h2>Apariencia</h2>
        <div class="segmented" role="group" aria-label="Tema">
          <button type="button" data-set-theme="light">Claro</button>
          <button type="button" data-set-theme="dark">Oscuro</button>
        </div>
      </div>
      <div class="panel">
        <h2>Copia de seguridad</h2>
        <p>Guarda todo, fotos incluidas, en un archivo. Sirve si cambiás de celular o borrás el navegador.</p>
        <div class="form-grid">
          <button class="btn btn-primary" id="ajustesExportAll" type="button">${icon('download')} Guardar copia</button>
          <button class="btn btn-secondary" id="ajustesImportAll" type="button">${icon('upload')} Restaurar</button>
        </div>
        <input id="ajustesImportFile" type="file" accept="application/json,.json" hidden>
      </div>
      ${fold({ title: 'Información', ico: 'list', body: `<div id="ajustesOverview" class="settings-list"></div>` })}
      <div class="danger-zone">
        <button class="btn-text-danger" id="ajustesResetAll" type="button">Borrar todos los datos</button>
        <div class="dz-desc">Borra uñas, fotos, ciclo, turnos y avisos de este celular. No se puede deshacer.</div>
      </div>
    `,
  };

  const viewMounts = {
    unas: () => unasModule.mount(),
    ciclo: () => cicloModule.mount(),
    turnos: () => turnosModule.mount(),
    recordatorios: () => recordatoriosModule.mount(),
    ajustes: () => ajustesModule.mount(),
    bienvenida: () => {
      const inp = $('welcomeName'), prev = $('welcomePreview');
      const p = loadProfile();
      if (inp) {
        inp.value = p.name;
        const upd = () => { if (prev) prev.textContent = greetingFor(inp.value); };
        upd(); inp.addEventListener('input', upd);
        inp.addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); $('welcomeStart').click(); } });
      }
      const finish = name => {
        if (!saveProfile({ name, welcomed: true })) toast('No se pudo guardar. Revisá que el navegador permita guardar datos.', 'error');
        navigate('inicio');
      };
      $('welcomeStart').addEventListener('click', () => finish(inp ? inp.value : ''));
      $('welcomeSkip').addEventListener('click', () => finish(''));
    },
  };
  const toast = (msg, type) => showToast(msg, type);

  let currentView = DEFAULT_VIEW, lastRenderDay = '';
  const renderView = view => {
    if (!VIEWS[view]) view = DEFAULT_VIEW;
    currentView = view; lastRenderDay = todayISO();
    const main = $('view');
    try {
      main.innerHTML = `<div class="view-enter">${views[view]()}</div>`;
    } catch (e) {
      logErr('renderView', e);
      main.innerHTML = `<div class="view-enter"><div class="placeholder"><h2>Algo se rompió</h2><p>${escapeHtml(e.message || '')}</p></div></div>`;
    }
    setActiveNav(view);
    document.body.classList.toggle('no-nav', view === 'bienvenida');
    document.title = VIEWS[view].title + ' · Mi espacio';
    main.querySelectorAll('[data-open-fold]').forEach(btn => {
      btn.addEventListener('click', () => {
        const d = $(btn.dataset.openFold);
        if (!d) return;
        d.open = true;
        d.scrollIntoView({ behavior: 'smooth', block: 'start' });
      });
    });
    main.querySelectorAll('[data-view]').forEach(el => {
      if (el.tagName !== 'BUTTON') {
        el.addEventListener('click', () => navigate(el.dataset.view));
        el.addEventListener('keydown', ev => {
          if (ev.key === 'Enter' || ev.key === ' ') { ev.preventDefault(); navigate(el.dataset.view); }
        });
      } else if (el.parentElement && el.parentElement.classList.contains('empty-shortcuts')) {
        el.addEventListener('click', () => navigate(el.dataset.view));
      }
    });
    main.querySelectorAll('[data-action]').forEach(btn => {
      btn.addEventListener('click', () => {
        const act = btn.dataset.action;
        if (act.startsWith('go:')) navigate(act.slice(3));
      });
    });
    if (typeof viewMounts[view] === 'function') {
      try { viewMounts[view](); } catch (e) { logErr('mount ' + view, e); }
    }
    try { main.focus({ preventScroll: true }); } catch (e) {}
    window.scrollTo(0, 0);
  };

  const init = () => {
    renderNav();
    $('headerSettings').addEventListener('click', () => navigate('ajustes'));
    $('brand').addEventListener('click', () => navigate('inicio'));
    $('brand').addEventListener('keydown', e => {
      if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); navigate('inicio'); }
    });
    document.addEventListener('keydown', e => {
      if (e.key === 'Escape') {
        const editingForm = document.querySelector('.edit-form');
        if (editingForm) {
          const cancelBtn = editingForm.querySelector('[data-cancel-edit]');
          if (cancelBtn) { e.preventDefault(); cancelBtn.click(); }
        }
      }
    });
    document.addEventListener('visibilitychange', () => {
      if (document.visibilityState !== 'visible') return;
      const dayChanged = lastRenderDay !== todayISO();
      const ae = document.activeElement;
      const typing = ae && /^(INPUT|TEXTAREA|SELECT)$/.test(ae.tagName);
      if (typing) return;
      if (dayChanged || currentView === 'inicio') renderView(parseHash());
    });
    window.addEventListener('hashchange', onHashChange);
    onHashChange();
  };

  init();

  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('./sw.js').catch(e => console.log('SW reg failed', e));
    });
  }
})();
</script>
</body>
</html>
