<html lang="es" data-theme="dark">
<head>
<meta charset="utf-8">

<meta name="description" content="Mi espacio: agenda de uñas, ciclo menstrual, turnos y recordatorios. Todo en un solo lugar, guardado en tu dispositivo.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%E2%9C%A8%3C/text%3E%3C/svg%3E">

<meta name="apple-mobile-web-app-title" content="Mi espacio">
<link rel="manifest" href="./manifest.webmanifest">
<title>Mi espacio</title>
<style>
:root {
  --radius: 20px; --radius-sm: 14px; --radius-xs: 10px;
  --font: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  --accent: #c04e88; --accent-2: #7c5cff;
  --good: #4ade80; --warn: #fbbf24; --danger: #f87171;
  --grad: linear-gradient(135deg, #c04e88 0%, #7c5cff 100%);
  --grad-soft: linear-gradient(135deg, rgba(192,78,136,.15) 0%, rgba(124,92,255,.15) 100%);
}
[data-theme="dark"] {
  --bg: #0f0d13; --bg-soft: #1a1720;
  --card: #211d29; --card-hover: #2a2534;
  --border: #322c3e; --border-soft: #262130;
  --ink: #f2eef8; --ink-strong: #ffffff;
  --muted: #9b93aa; --muted-soft: #6e687a;
  --header-bg: rgba(15,13,19,.72); --nav-bg: rgba(26,23,32,.92);
  --shadow-lg: 0 20px 50px -12px rgba(0,0,0,.6);
  --phase-menstrual: #e64980; --phase-follicular: #4dabf7;
  --phase-fertile: #37b24d; --phase-luteal: #f59f00;
}
[data-theme="light"] {
  --bg: #faf7fb; --bg-soft: #f2ecf5;
  --card: #ffffff; --card-hover: #faf5fc;
  --border: #ebe3f0; --border-soft: #f2ecf5;
  --ink: #1a1720; --ink-strong: #0f0d13;
  --muted: #6b6279; --muted-soft: #9b93aa;
  --header-bg: rgba(250,247,251,.78); --nav-bg: rgba(255,255,255,.92);
  --shadow-lg: 0 20px 50px -12px rgba(60,30,80,.15);
  --phase-menstrual: #e64980; --phase-follicular: #4dabf7;
  --phase-fertile: #37b24d; --phase-luteal: #f59f00;
}
html { scroll-behavior: smooth; }
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; }
body {
  font-family: var(--font); background: var(--bg); color: var(--ink);
  min-height: 100vh; -webkit-font-smoothing: antialiased;
  transition: background-color .3s ease, color .3s ease;
  background-image:
    radial-gradient(ellipse at top left, rgba(192,78,136,.10), transparent 50%),
    radial-gradient(ellipse at top right, rgba(124,92,255,.10), transparent 50%);
}
[data-theme="light"] body {
  background-image:
    radial-gradient(ellipse at top left, rgba(192,78,136,.06), transparent 50%),
    radial-gradient(ellipse at top right, rgba(124,92,255,.06), transparent 50%);
}
button { font: inherit; border: 0; background: none; color: inherit; cursor: pointer; -webkit-tap-highlight-color: transparent; }
button:focus-visible, a:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible {
  outline: 2px solid var(--accent);
  outline-offset: 2px;
  border-radius: 8px;
}
button:disabled { opacity: .55; cursor: not-allowed; }
a { color: inherit; text-decoration: none; }

.app-header { position: sticky; top: 0; z-index: 50; background: var(--header-bg); backdrop-filter: saturate(180%) blur(14px); -webkit-backdrop-filter: saturate(180%) blur(14px); border-bottom: 1px solid var(--border-soft); }
.header-inner { max-width: 1200px; margin: 0 auto; padding: 12px 20px; display: flex; align-items: center; gap: 16px; }
.brand { display: flex; align-items: center; gap: 10px; flex-shrink: 0; cursor: pointer; padding: 4px 8px; border-radius: 10px; transition: background-color .2s ease; }
.brand:hover { background: var(--card-hover); }
.brand-icon { width: 36px; height: 36px; border-radius: 11px; background: var(--grad); display: grid; place-items: center; font-size: 1.1rem; box-shadow: 0 8px 20px -6px rgba(192,78,136,.55); }
.brand-text { font-weight: 800; font-size: 1.05rem; letter-spacing: -.01em; color: var(--ink-strong); }
.nav-desktop { display: none; flex: 1; align-items: center; gap: 4px; margin-left: 8px; }
.nav-desktop button { padding: 9px 14px; border-radius: 10px; font-size: .88rem; font-weight: 600; color: var(--muted); display: inline-flex; align-items: center; gap: 7px; position: relative; transition: color .2s ease, background-color .2s ease; }
.nav-desktop button:hover { color: var(--ink); background: var(--card-hover); }
.nav-desktop button.active { color: var(--ink-strong); }
.nav-desktop button.active::after { content: ''; position: absolute; left: 14px; right: 14px; bottom: -1px; height: 2px; background: var(--grad); border-radius: 2px; }
.theme-toggle { width: 40px; height: 40px; border-radius: 11px; background: var(--card); border: 1px solid var(--border); display: grid; place-items: center; font-size: 1.05rem; margin-left: auto; transition: all .2s ease; }
.theme-toggle:hover { background: var(--card-hover); transform: rotate(15deg); }

.app-main { max-width: 1200px; margin: 0 auto; padding: 28px 20px calc(96px + env(safe-area-inset-bottom)); min-height: calc(100vh - 65px); }
.view-enter { animation: viewIn .35s cubic-bezier(.2,.8,.2,1); }
@keyframes viewIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

.page-head { margin-bottom: 24px; }
.page-head .tag { display: inline-block; padding: 5px 12px; background: var(--grad-soft); border: 1px solid rgba(192,78,136,.28); border-radius: 999px; font-size: .72rem; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--accent); margin-bottom: 12px; }
.page-head h1 { font-size: clamp(1.7rem, 3.5vw, 2.2rem); font-weight: 800; letter-spacing: -.02em; color: var(--ink-strong); margin-bottom: 8px; }
.page-head p { color: var(--muted); font-size: .98rem; line-height: 1.55; max-width: 620px; }

.panel { background: var(--card); border: 1px solid var(--border); border-radius: var(--radius); padding: 22px; margin-top: 16px; }
.panel h2 { font-size: 1.12rem; font-weight: 750; margin-bottom: 6px; color: var(--ink-strong); }
.panel > p { color: var(--muted); margin-bottom: 16px; font-size: .91rem; line-height: 1.5; }
.section-title { font-size: 1.1rem; font-weight: 750; color: var(--ink-strong); margin: 28px 0 14px; }

.alert-banner { display: flex; align-items: center; gap: 12px; padding: 14px 16px; border-radius: var(--radius-sm); background: rgba(251,191,36,.1); border: 1px solid rgba(251,191,36,.35); color: var(--ink); font-size: .9rem; font-weight: 600; margin-bottom: 16px; line-height: 1.4; }
[data-theme="light"] .alert-banner { background: rgba(251,191,36,.12); }
.alert-banner .ab-icon { font-size: 1.15rem; flex-shrink: 0; }
.alert-banner.danger { background: rgba(248,113,113,.1); border-color: rgba(248,113,113,.35); }

.summary-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 14px; margin-bottom: 8px; }
.summary-card { background: var(--card); border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 18px; display: flex; flex-direction: column; gap: 10px; position: relative; overflow: hidden; cursor: pointer; transition: transform .2s ease, border-color .2s ease, box-shadow .2s ease; animation: fadeInUp .28s cubic-bezier(.2,.8,.2,1); }
.summary-card:hover { transform: translateY(-3px); border-color: rgba(192,78,136,.4); box-shadow: 0 20px 50px -12px rgba(0,0,0,.5), 0 0 0 1px rgba(192,78,136,.15); }
.summary-card::before { content: ''; position: absolute; top: 0; left: 0; right: 0; height: 3px; background: var(--grad); opacity: 0; transition: opacity .2s ease; }
.summary-card:hover::before { opacity: 1; }
.summary-card.is-empty { border-style: dashed; }
.summary-card.is-empty .sc-ico { opacity: .55; }
.summary-card.is-empty .sc-value { color: var(--muted); }
.summary-card.is-warn::before { background: var(--warn); opacity: 1; }
.summary-card.is-warn .sc-value { color: var(--warn); }
.summary-card.is-overdue::before { background: var(--danger); opacity: 1; }
.summary-card.is-overdue .sc-value { color: var(--danger); }
.summary-card.is-today::before { background: var(--accent); opacity: 1; }
.summary-card.is-today .sc-value { color: var(--accent); }
.summary-card .sc-ico { width: 42px; height: 42px; border-radius: 12px; background: var(--grad-soft); display: grid; place-items: center; font-size: 1.2rem; border: 1px solid rgba(192,78,136,.15); }
.summary-card .sc-label { font-size: .74rem; color: var(--muted); font-weight: 700; text-transform: uppercase; letter-spacing: .05em; }
.summary-card .sc-value { font-size: 1.08rem; font-weight: 750; color: var(--ink-strong); line-height: 1.3; }
.summary-card .sc-sub { font-size: .82rem; color: var(--muted); margin-top: -2px; line-height: 1.4; }

.event-list { display: flex; flex-direction: column; gap: 10px; }
.event-item { display: flex; align-items: center; gap: 14px; padding: 14px 16px; background: var(--card); border: 1px solid var(--border); border-radius: var(--radius-sm); cursor: pointer; transition: transform .2s ease, border-color .2s ease, background-color .2s ease; animation: fadeInUp .28s cubic-bezier(.2,.8,.2,1); }
.event-item:hover { transform: translateX(3px); border-color: rgba(192,78,136,.35); background: var(--card-hover); }
.event-item .ei-ico { width: 42px; height: 42px; border-radius: 12px; background: var(--grad-soft); display: grid; place-items: center; font-size: 1.15rem; flex-shrink: 0; border: 1px solid rgba(192,78,136,.15); }
.event-item .ei-body { flex: 1; min-width: 0; }
.event-item .ei-title { font-weight: 700; font-size: .95rem; color: var(--ink-strong); margin-bottom: 3px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.event-item .ei-meta { font-size: .82rem; color: var(--muted); }
.event-item .ei-when { font-size: .82rem; font-weight: 750; color: var(--accent); flex-shrink: 0; text-align: right; line-height: 1.3; }
.event-item .ei-when .ei-when-sub { display: block; font-size: .72rem; font-weight: 500; color: var(--muted); margin-top: 2px; }
.event-item.is-today .ei-when { color: var(--warn); }
.event-item.is-today .ei-ico { background: rgba(251,191,36,.15); border-color: rgba(251,191,36,.3); }

.empty-dashboard { text-align: center; padding: 36px 24px; background: var(--card); border: 1px dashed var(--border); border-radius: var(--radius); margin-top: 24px; }
.empty-dashboard h2 { font-size: 1.1rem; font-weight: 750; color: var(--ink-strong); margin-bottom: 6px; }
.empty-dashboard p { color: var(--muted); font-size: .9rem; margin-bottom: 22px; line-height: 1.5; }
.empty-shortcuts { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 10px; max-width: 480px; margin: 0 auto; }
.empty-shortcuts button { display: flex; flex-direction: column; align-items: center; gap: 6px; padding: 16px 10px; background: var(--grad-soft); border: 1px solid rgba(192,78,136,.2); border-radius: 14px; font-size: .85rem; font-weight: 650; color: var(--ink); transition: all .2s ease; }
.empty-shortcuts button:hover { transform: translateY(-2px); border-color: rgba(192,78,136,.45); background: var(--card-hover); }
.empty-shortcuts button .es-ico { font-size: 1.4rem; }

.placeholder { background: var(--card); border: 1px dashed var(--border); border-radius: var(--radius); padding: 44px 28px; text-align: center; margin-top: 20px; }
.placeholder .ph-icon { width: 64px; height: 64px; border-radius: 20px; background: var(--grad-soft); display: grid; place-items: center; font-size: 1.8rem; margin: 0 auto 18px; border: 1px solid rgba(192,78,136,.2); }
.placeholder h2 { font-size: 1.15rem; font-weight: 750; color: var(--ink-strong); margin-bottom: 8px; }
.placeholder p { color: var(--muted); font-size: .92rem; line-height: 1.55; max-width: 420px; margin: 0 auto 20px; }

.btn { display: inline-flex; align-items: center; gap: 8px; padding: 11px 18px; border-radius: 12px; font-weight: 700; font-size: .9rem; transition: all .2s ease; }
.btn:active:not(:disabled) { transform: scale(.97); }
.btn-primary { background: var(--grad); color: #fff; box-shadow: 0 10px 26px -8px rgba(192,78,136,.6); }
.btn-primary:hover { transform: translateY(-1px); filter: brightness(1.08); }
.btn-secondary { background: var(--grad-soft); color: var(--ink); border: 1px solid rgba(192,78,136,.25); }
.btn-secondary:hover { border-color: rgba(192,78,136,.5); background: var(--card-hover); }
.btn-ghost { border: 1px solid var(--border); color: var(--ink); background: transparent; }
.btn-ghost:hover { background: var(--card-hover); }
.btn-danger { background: rgba(248,113,113,.15); color: var(--danger); border: 1px solid rgba(248,113,113,.35); }
.btn-danger:hover { background: rgba(248,113,113,.25); }
.btn-sm { padding: 7px 12px; font-size: .82rem; }
.btn-icon { padding: 8px; width: 34px; height: 34px; display: grid; place-items: center; }
.actions { display: flex; gap: 9px; flex-wrap: wrap; margin-top: 16px; }

.form-grid { display: grid; grid-template-columns: repeat(2, minmax(0,1fr)); gap: 14px; }
.form-grid .full { grid-column: 1 / -1; }
label { display: block; font-size: .88rem; font-weight: 650; margin-bottom: 6px; color: var(--ink); }
input, select, textarea { width: 100%; font: inherit; padding: 11px 12px; border: 1px solid var(--border); border-radius: 11px; background: var(--bg-soft); color: var(--ink); transition: border-color .2s ease, background-color .2s ease; }
input:focus, select:focus, textarea:focus { outline: none; border-color: var(--accent); background: var(--card); }
textarea { resize: vertical; min-height: 70px; font-family: inherit; }
input[type="file"] { padding: 8px; cursor: pointer; }
.field-hint { font-size: .78rem; color: var(--muted); margin-top: 4px; line-height: 1.4; }
.required { color: var(--danger); }

.cards-grid { display: grid; grid-template-columns: repeat(2, minmax(0,1fr)); gap: 14px; }
.nail-card { background: var(--card); border: 1px solid var(--border); border-radius: var(--radius); overflow: hidden; display: flex; flex-direction: column; position: relative; animation: fadeInUp .28s cubic-bezier(.2,.8,.2,1); }
.nail-card::before { content: ''; position: absolute; top: 0; left: 0; right: 0; height: 3px; background: var(--grad); }
.card-top { display: flex; gap: 12px; align-items: center; padding: 18px 18px 10px; }
.emoji { width: 46px; height: 46px; display: grid; place-items: center; border-radius: 14px; background: var(--grad-soft); font-size: 1.5rem; border: 1px solid rgba(192,78,136,.15); flex-shrink: 0; }
.card-top h3 { font-size: 1.06rem; font-weight: 750; color: var(--ink-strong); margin-bottom: 3px; }
.card-top small { color: var(--muted); font-size: .82rem; }
.card-photo { padding: 0 18px 10px; }
.card-photo img { width: 100%; max-height: 150px; object-fit: cover; border-radius: 10px; border: 1px solid var(--border); cursor: zoom-in; display: block; transition: filter .2s ease; }
.card-photo img:hover { filter: brightness(1.08); }
.card-body { padding: 4px 18px 18px; display: flex; flex-direction: column; gap: 10px; }
.next-label { color: var(--muted); font-size: .82rem; }
.next-date { font-size: 1.16rem; font-weight: 750; color: var(--ink-strong); margin-top: -6px; }
.pill { display: inline-block; align-self: flex-start; font-size: .78rem; font-weight: 650; background: var(--grad-soft); color: var(--ink); padding: 5px 10px; border-radius: 999px; border: 1px solid rgba(192,78,136,.2); }
.pill.warn { background: rgba(251,191,36,.15); border-color: rgba(251,191,36,.35); color: var(--warn); }
.pill.overdue { background: rgba(248,113,113,.15); border-color: rgba(248,113,113,.35); color: var(--danger); }
.pill.today { background: rgba(192,78,136,.2); border-color: rgba(192,78,136,.5); color: var(--accent); }
.card-body button { width: 100%; margin-top: auto; }
.photo-preview-wrap { margin-top: 10px; }
.photo-preview img { max-width: 100%; max-height: 180px; border-radius: 10px; border: 1px solid var(--border); display: block; }
.history-item { display: flex; justify-content: space-between; gap: 12px; padding: 14px 0; border-bottom: 1px solid var(--border); align-items: center; }
.history-item:last-child { border-bottom: 0; }
.history-left { display: flex; gap: 12px; align-items: center; min-width: 0; }
.history-thumb { width: 48px; height: 48px; object-fit: cover; border-radius: 10px; border: 1px solid var(--border); cursor: zoom-in; flex-shrink: 0; transition: filter .2s ease; }
.history-thumb:hover { filter: brightness(1.1); }
.history-item strong { display: block; font-size: .95rem; color: var(--ink-strong); }
.history-item small { color: var(--muted); font-size: .82rem; display: block; margin-top: 2px; }
.history-item button { padding: 7px 12px; font-size: .8rem; flex-shrink: 0; }
.empty { color: var(--muted); padding: 16px 0; font-size: .9rem; text-align: center; }

.phase-wrap { padding-top: 26px; }
.phase-bar { display: flex; height: 40px; border-radius: 20px; overflow: visible; position: relative; background: var(--bg-soft); border: 1px solid var(--border); }
.phase-segment { height: 100%; }
.phase-segment:first-child { border-top-left-radius: 20px; border-bottom-left-radius: 20px; }
.phase-segment:last-child { border-top-right-radius: 20px; border-bottom-right-radius: 20px; }
.phase-segment.menstrual { background: var(--phase-menstrual); }
.phase-segment.follicular { background: var(--phase-follicular); }
.phase-segment.fertile { background: var(--phase-fertile); }
.phase-segment.luteal { background: var(--phase-luteal); }
.phase-marker { position: absolute; top: -24px; transform: translateX(-50%); color: var(--accent); font-size: 1.15rem; line-height: 1; text-shadow: 0 0 3px var(--card); pointer-events: none; }
.phase-marker.overdue { color: var(--danger); }
.phase-legend { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 16px; font-size: .82rem; color: var(--muted); }
.phase-legend span { display: inline-flex; align-items: center; gap: 6px; }
.phase-legend .dot { display: inline-block; width: 10px; height: 10px; border-radius: 50%; }
.phase-legend .dot.menstrual { background: var(--phase-menstrual); }
.phase-legend .dot.follicular { background: var(--phase-follicular); }
.phase-legend .dot.fertile { background: var(--phase-fertile); }
.phase-legend .dot.luteal { background: var(--phase-luteal); }
.phase-today-label { margin-top: 14px; font-size: .9rem; color: var(--muted); line-height: 1.5; }
.phase-today-label strong { color: var(--ink); }
.quick-actions { display: flex; gap: 10px; flex-wrap: wrap; }
.quick-actions button { flex: 1 1 200px; padding: 15px 16px; font-size: 1rem; }
.badge-ongoing { display: inline-block; font-size: .72rem; font-weight: 700; background: var(--grad-soft); color: var(--ink); padding: 3px 8px; border-radius: 999px; margin-left: 6px; border: 1px solid rgba(192,78,136,.2); }
.badge-long { background: rgba(251,191,36,.15); border-color: rgba(251,191,36,.35); color: var(--warn); }
.end-form { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; margin-top: 8px; padding: 8px; background: var(--bg-soft); border-radius: 10px; }
.end-form input { width: 150px; padding: 6px 8px; font-size: .85rem; }
.end-form button { padding: 6px 10px; font-size: .82rem; }
.stats-grid { display: grid; grid-template-columns: repeat(2, minmax(0,1fr)); gap: 12px; }
.stat { padding: 14px; background: var(--bg-soft); border-radius: 12px; border: 1px solid var(--border-soft); }
.stat span { display: block; color: var(--muted); font-size: .78rem; margin-bottom: 4px; font-weight: 650; }
.stat strong { font-size: 1rem; color: var(--ink-strong); }

.appt-list { display: flex; flex-direction: column; gap: 10px; }
.appt-item { background: var(--card); border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 16px; display: flex; gap: 14px; align-items: flex-start; position: relative; overflow: hidden; transition: border-color .2s ease, background-color .2s ease; animation: fadeInUp .28s cubic-bezier(.2,.8,.2,1); }
.appt-item::before { content: ''; position: absolute; left: 0; top: 0; bottom: 0; width: 3px; background: var(--grad); }
.appt-item.attended::before { background: var(--good); }
.appt-item.no_show::before { background: var(--muted-soft); }
.appt-item.overdue::before { background: var(--danger); }
.appt-item.today::before { background: var(--warn); }
.appt-item.is-editing { border-color: var(--accent); }
.appt-date-badge { display: flex; flex-direction: column; align-items: center; justify-content: center; min-width: 58px; padding: 8px 6px; background: var(--bg-soft); border-radius: 12px; flex-shrink: 0; border: 1px solid var(--border-soft); }
.appt-date-badge .db-day { font-size: 1.35rem; font-weight: 800; color: var(--ink-strong); line-height: 1; }
.appt-date-badge .db-month { font-size: .68rem; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; margin-top: 3px; }
.appt-item.attended .appt-date-badge, .appt-item.no_show .appt-date-badge { opacity: .6; }
.appt-item.attended .db-day, .appt-item.no_show .db-day { text-decoration: line-through; }
.appt-body { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 5px; }
.appt-title-row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.appt-title { font-size: 1.02rem; font-weight: 750; color: var(--ink-strong); line-height: 1.3; }
.appt-item.attended .appt-title, .appt-item.no_show .appt-title { color: var(--muted); text-decoration: line-through; }
.appt-badge { display: inline-block; font-size: .68rem; font-weight: 700; padding: 2px 8px; border-radius: 999px; text-transform: uppercase; letter-spacing: .05em; }
.appt-badge.attended { background: rgba(74,222,128,.15); color: var(--good); border: 1px solid rgba(74,222,128,.3); }

.appt-actions-row .btn-close.attended:hover { background: rgba(74,222,128,.25); }

.filter-tabs { display: flex; gap: 6px; margin-bottom: 14px; flex-wrap: wrap; }

.filter-tabs button .tab-count { display: inline-block; margin-left: 6px; padding: 1px 7px; background: rgba(0,0,0,.08); color: var(--muted); border-radius: 999px; font-size: .72rem; font-weight: 700; }
[data-theme="dark"] .filter-tabs button .tab-count { background: rgba(255,255,255,.1); color: var(--ink); }
.filter-tabs button.active .tab-count { background: rgba(255,255,255,.28); color: #fff; }

.reminder-list { display: flex; flex-direction: column; gap: 8px; }
.reminder-item { display: flex; gap: 12px; align-items: flex-start; padding: 14px 16px; background: var(--card); border: 1px solid var(--border); border-radius: var(--radius-sm); position: relative; transition: border-color .2s ease, background-color .2s ease, opacity .2s ease; animation: fadeInUp .28s cubic-bezier(.2,.8,.2,1); }
.reminder-item.overdue { border-color: rgba(248,113,113,.35); background: rgba(248,113,113,.04); }
.reminder-item.today { border-color: rgba(251,191,36,.4); background: rgba(251,191,36,.04); }
.reminder-item.done { opacity: .55; }
.reminder-item.is-editing { border-color: var(--accent); }
.reminder-check { width: 34px; height: 34px; border-radius: 50%; border: 2px solid var(--border); background: transparent; display: grid; place-items: center; flex-shrink: 0; cursor: pointer; transition: all .2s ease; margin-top: 1px; }
.reminder-check:hover:not(:disabled) { border-color: var(--accent); background: var(--grad-soft); }

.reminder-item.done .reminder-check .check-icon { opacity: 1; transform: scale(1); }
.reminder-body { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 5px; }

.reminder-notes { font-size: .84rem; color: var(--muted); line-height: 1.5; padding: 8px 10px; background: var(--bg-soft); border-radius: 8px; border-left: 3px solid var(--border); margin-top: 4px; white-space: pre-wrap; word-break: break-word; }
.reminder-actions { display: flex; gap: 4px; flex-shrink: 0; align-self: flex-start; }
.reminder-actions button { width: 32px; height: 32px; padding: 0; display: grid; place-items: center; border-radius: 8px; font-size: .9rem; }

.reminder-actions .btn-ghost:hover { border-color: var(--border); background: var(--card-hover); }

.settings-list { display: flex; flex-direction: column; gap: 12px; }

.setting-row .sr-info { flex: 1; min-width: 200px; }
.setting-row .sr-title { font-size: .95rem; font-weight: 700; color: var(--ink-strong); margin-bottom: 3px; }
.setting-row .sr-desc { font-size: .82rem; color: var(--muted); line-height: 1.4; }
.setting-row .sr-action { flex-shrink: 0; }
.storage-bar-wrap { margin-top: 6px; }
.storage-bar { height: 8px; background: var(--bg-soft); border-radius: 4px; overflow: hidden; margin-top: 8px; }
.storage-bar-fill { height: 100%; background: var(--grad); border-radius: 4px; transition: width .3s ease; }
.storage-info { display: flex; justify-content: space-between; margin-top: 6px; font-size: .8rem; color: var(--muted); }
.version-badge { display: inline-block; padding: 3px 10px; background: var(--grad-soft); color: var(--accent); border: 1px solid rgba(192,78,136,.3); border-radius: 999px; font-size: .78rem; font-weight: 700; }
.danger-zone { border: 1px solid rgba(248,113,113,.4); background: rgba(248,113,113,.04); border-radius: 12px; padding: 16px; margin-top: 12px; }
.danger-zone .dz-title { color: var(--danger); font-weight: 750; font-size: .95rem; margin-bottom: 6px; }
.danger-zone .dz-desc { color: var(--muted); font-size: .85rem; line-height: 1.5; margin-bottom: 12px; }

.lightbox { position: fixed; inset: 0; background: rgba(0,0,0,.92); display: flex; align-items: center; justify-content: center; padding: 20px; z-index: 250; backdrop-filter: blur(8px); }
.lightbox[hidden] { display: none; }
.lightbox img { max-width: 100%; max-height: 100%; border-radius: 10px; box-shadow: 0 20px 60px rgba(0,0,0,.5); }
.lightbox-close { position: absolute; top: calc(16px + env(safe-area-inset-top, 0px)); right: 20px; width: 44px; height: 44px; border-radius: 50%; background: #ffffff; color: #111; font-size: 1.5rem; line-height: 1; padding: 0; display: grid; place-items: center; box-shadow: 0 4px 16px rgba(0,0,0,.3); }

.nav-mobile { position: fixed; bottom: 0; left: 0; right: 0; z-index: 60; background: var(--nav-bg); backdrop-filter: saturate(180%) blur(14px); -webkit-backdrop-filter: saturate(180%) blur(14px); border-top: 1px solid var(--border-soft); padding: 6px 4px calc(6px + env(safe-area-inset-bottom)); display: grid; grid-template-columns: repeat(6, 1fr); gap: 2px; }
.nav-mobile button { display: flex; flex-direction: column; align-items: center; gap: 3px; padding: 8px 4px; border-radius: 10px; color: var(--muted); font-size: .62rem; font-weight: 650; letter-spacing: .01em; transition: color .15s ease, background-color .15s ease; position: relative; min-width: 0; }
.nav-mobile button .nm-ico { font-size: 1.15rem; line-height: 1; transition: transform .2s ease; }
.nav-mobile button .nm-label { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 100%; }
.nav-mobile button.active { color: var(--accent); }
.nav-mobile button.active .nm-ico { transform: scale(1.12); }
.nav-mobile button.active::before { content: ''; position: absolute; top: 2px; left: 50%; transform: translateX(-50%); width: 22px; height: 3px; background: var(--grad); border-radius: 2px; }

.toast { position: fixed; left: 50%; bottom: calc(88px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%) translateY(16px); background: var(--card); border: 1px solid var(--border); color: var(--ink); padding: 12px 18px; border-radius: 14px; box-shadow: var(--shadow-lg); font-size: .9rem; font-weight: 600; max-width: calc(100vw - 32px); opacity: 0; pointer-events: none; transition: opacity .2s ease, transform .2s ease; z-index: 300; display: flex; align-items: center; gap: 14px; }
.toast.show { opacity: 1; transform: translateX(-50%) translateY(0); pointer-events: auto; }
.toast.error { color: var(--danger); }
.toast .toast-action { background: var(--grad); color: #fff; padding: 6px 12px; border-radius: 8px; font-size: .82rem; font-weight: 700; flex-shrink: 0; }
.toast .toast-action:hover { filter: brightness(1.1); }

@keyframes fadeInUp {
  from { opacity: 0; transform: translateY(6px); }
  to { opacity: 1; transform: translateY(0); }
}

@media (min-width: 768px) {
  .nav-desktop { display: flex; }
  .nav-mobile { display: none; }
  .app-main { padding: 36px 28px 60px; }
  .header-inner { padding: 14px 28px; }
  .toast { bottom: 24px; }
}
@media (max-width: 620px) {
  .cards-grid, .summary-grid, .form-grid, .stats-grid { grid-template-columns: 1fr; }
  .appt-item { flex-wrap: wrap; }
  .appt-actions { flex-direction: row; width: 100%; }
  .appt-actions-row { flex: 1; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: .01ms !important; transition-duration: .01ms !important; }
  html { scroll-behavior: auto; }
}
</style>
</head>
<body>

<header class="app-header">
  <div class="header-inner">
    <div class="brand" id="brand" role="button" tabindex="0" aria-label="Ir al inicio">
      <span class="brand-icon" aria-hidden="true">✨</span>
      <span class="brand-text">Mi espacio</span>
    </div>
    <nav class="nav-desktop" id="navDesktop" aria-label="Navegación principal"></nav>
    <button class="theme-toggle" id="themeToggle" type="button" aria-label="Cambiar tema">
      <span id="themeIcon">🌙</span>
    </button>
  </div>
</header>

<main class="app-main" id="view" tabindex="-1"></main>

<nav class="nav-mobile" id="navMobile" aria-label="Navegación principal"></nav>

<div class="toast" id="toast" role="status" aria-live="polite" aria-atomic="true"></div>

<script>
(() => {
  'use strict';

  const THEME_KEY = 'hubThemeV1';
  const DEFAULT_THEME = 'dark';
  const KEY_UNAS = 'agendaUnasDemoV1';
  const KEY_CICLO = 'miCicloV1';
  const KEY_TURNOS = 'hubTurnosV1';
  const KEY_RECORDATORIOS = 'hubRecordatoriosV1';
  const HUB_VERSION = '1.0.0';

  const VIEWS = {
    inicio:        { label: 'Inicio',        icon: '🏠', title: 'Inicio' },
    unas:          { label: 'Uñas',          icon: '💅', title: 'Agenda de uñas' },
    ciclo:         { label: 'Ciclo',         icon: '🌸', title: 'Mi ciclo' },
    turnos:        { label: 'Turnos',        icon: '📅', title: 'Turnos' },
    recordatorios: { label: 'Recordatorios', icon: '🔔', title: 'Recordatorios' },
    ajustes:       { label: 'Ajustes',       icon: '⚙️', title: 'Ajustes' },
  };
  const DEFAULT_VIEW = 'inicio';

  const $ = id => document.getElementById(id);
  const log = (...args) => { if (location.search.includes('debug')) console.log('[hub]', ...args); };
  const logErr = (...args) => console.error('[hub]', ...args);

  const toISODate = dt =>
    `${dt.getFullYear()}-${String(dt.getMonth() + 1).padStart(2, '0')}-${String(dt.getDate()).padStart(2, '0')}`;
  const todayISO = () => toISODate(new Date());
  const isValidISODate = s => {
    if (typeof s !== 'string' || !/^\d{4}-\d{2}-\d{2}$/.test(s)) return false;
    const [y, m, d] = s.split('-').map(Number);
    const dt = new Date(y, m - 1, d);
    return dt.getFullYear() === y && dt.getMonth() === m - 1 && dt.getDate() === d;
  };
  const isValidTime = s => typeof s === 'string' && /^\d{2}:\d{2}$/.test(s) && (() => {
    const [h, m] = s.split(':').map(Number);
    return h >= 0 && h <= 23 && m >= 0 && m <= 59;
  })();
  const addDaysISO = (value, days) => {
    const [y, m, d] = value.split('-').map(Number);
    const dt = new Date(y, m - 1, d);
    dt.setDate(dt.getDate() + days);
    return toISODate(dt);
  };
  const dayDiff = (from, to) =>
    Math.round((new Date(to + 'T00:00:00') - new Date(from + 'T00:00:00')) / 86400000);
  const fmtDate = value => {
    if (!isValidISODate(value)) return '—';
    const [y, m, d] = value.split('-').map(Number);
    return new Date(y, m - 1, d).toLocaleDateString('es-AR', { day: 'numeric', month: 'short' });
  };
  const fmtDateLong = value => {
    if (!isValidISODate(value)) return '—';
    const [y, m, d] = value.split('-').map(Number);
    return new Date(y, m - 1, d).toLocaleDateString('es-AR', { day: 'numeric', month: 'long' });
  };
  const fmtDateFull = value => {
    if (!isValidISODate(value)) return '—';
    const [y, m, d] = value.split('-').map(Number);
    return new Date(y, m - 1, d).toLocaleDateString('es-AR', { weekday: 'short', day: 'numeric', month: 'short' });
  };
  const escapeHtml = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({
    '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
  }[c]));

  const systemPrefersLight = () =>
    window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches;
  const loadTheme = () => {
    try { const s = localStorage.getItem(THEME_KEY); if (s === 'light' || s === 'dark') return s; } catch (e) {}
    return systemPrefersLight() ? 'light' : DEFAULT_THEME;
  };
  const saveTheme = theme => { try { localStorage.setItem(THEME_KEY, theme); } catch (e) {} };
  const applyTheme = theme => {
    document.documentElement.setAttribute('data-theme', theme);
    const meta = document.querySelector('meta[name="theme-color"]');
    if (meta) meta.setAttribute('content', theme === 'light' ? '#faf7fb' : '#0f0d13');
    const icon = $('themeIcon');
    if (icon) icon.textContent = theme === 'light' ? '☀️' : '🌙';
    const btn = $('themeToggle');
    if (btn) btn.setAttribute('aria-label', theme === 'light' ? 'Cambiar a tema oscuro' : 'Cambiar a tema claro');
  };
  let currentTheme = loadTheme();
  applyTheme(currentTheme);
  const toggleTheme = () => {
    currentTheme = currentTheme === 'light' ? 'dark' : 'light';
    applyTheme(currentTheme); saveTheme(currentTheme);
  };
  if (window.matchMedia) {
    const mq = window.matchMedia('(prefers-color-scheme: light)');
    const onChange = e => {
      try { const s = localStorage.getItem(THEME_KEY); if (s === 'light' || s === 'dark') return; } catch (err) {}
      currentTheme = e.matches ? 'light' : 'dark';
      applyTheme(currentTheme);
    };
    if (mq.addEventListener) mq.addEventListener('change', onChange);
    else if (mq.addListener) mq.addListener(onChange);
  }

  const readLS = key => {
    try { const raw = localStorage.getItem(key); return raw ? JSON.parse(raw) : null; }
    catch (e) { return null; }
  };

  const normalizeApptStatus = a => {
    if (!a || typeof a !== 'object') return 'pending';
    if (a.status === 'pending' || a.status === 'attended' || a.status === 'no_show') return a.status;
    if (a.done === true) return 'attended';
    if (a.done === false) return 'pending';
    return 'pending';
  };

  const computeUnas = () => {
    const data = readLS(KEY_UNAS);
    if (!data || !Array.isArray(data.visits)) return { state: 'empty' };
    const settings = data.settings || {};
    const iH = Number(settings.handsInterval) || 3;
    const iF = Number(settings.feetInterval) || 5;
    const latest = { manos: null, pies: null };
    for (const v of data.visits) {
      if (!v || !['manos','pies'].includes(v.kind)) continue;
      if (!isValidISODate(v.date)) continue;
      if (!latest[v.kind] || v.date > latest[v.kind].date) latest[v.kind] = v;
    }
    const due = { manos: null, pies: null };
    if (latest.manos) due.manos = addDaysISO(latest.manos.date, iH * 7);
    if (latest.pies) due.pies = addDaysISO(latest.pies.date, iF * 7);
    let next = null;
    for (const kind of ['manos','pies']) if (due[kind] && (!next || due[kind] < next.date)) next = { kind, date: due[kind] };
    if (!next) return { state: 'empty' };
    const days = dayDiff(todayISO(), next.date);
    return { state: 'ok', kind: next.kind, date: next.date, days };
  };
  const computeCiclo = () => {
    const data = readLS(KEY_CICLO);
    if (!data || !Array.isArray(data.periods)) return { state: 'empty' };
    const periods = data.periods
      .filter(p => p && isValidISODate(p.startDate))
      .sort((a, b) => a.startDate.localeCompare(b.startDate));
    if (!periods.length) return { state: 'empty' };
    const defCycle = Number((data.settings && data.settings.defaultCycleLength)) || 28;
    const diffs = [];
    for (let i = 1; i < periods.length; i++) {
      const d = dayDiff(periods[i - 1].startDate, periods[i].startDate);
      if (d >= 21 && d <= 45) diffs.push(d);
    }
    const avgCycle = diffs.length ? Math.round(diffs.reduce((a, b) => a + b, 0) / diffs.length) : defCycle;
    const ongoing = periods.find(p => !p.endDate);
    if (ongoing) return { state: 'ongoing', day: dayDiff(ongoing.startDate, todayISO()) + 1, date: ongoing.startDate };
    const last = periods[periods.length - 1];
    const nextStart = addDaysISO(last.startDate, avgCycle);
    const days = dayDiff(todayISO(), nextStart);
    if (days < 0) return { state: 'overdue', days: -days, date: nextStart };
    if (days === 0) return { state: 'today', date: nextStart };
    return { state: 'ok', days, date: nextStart };
  };
  const computeTurnos = () => {
    const data = readLS(KEY_TURNOS);
    if (!data || !Array.isArray(data.appointments)) return { state: 'empty' };
    const up = data.appointments
      .filter(a => a && isValidISODate(a.date) && normalizeApptStatus(a) === 'pending' && a.date >= todayISO())
      .sort((a, b) => a.date.localeCompare(b.date) || (a.time || '').localeCompare(b.time || ''));
    if (!up.length) return { state: 'empty' };
    const n = up[0];
    return { state: 'ok', title: n.title || 'Turno', date: n.date, time: n.time, days: dayDiff(todayISO(), n.date) };
  };
  const computeRecordatorios = () => {
    const data = readLS(KEY_RECORDATORIOS);
    if (!data || !Array.isArray(data.reminders)) return { state: 'empty' };
    const pending = data.reminders.filter(r => r && isValidISODate(r.date) && !r.done);
    if (!pending.length) return { state: 'empty' };
    const overdue = pending.filter(r => r.date < todayISO()).length;
    const up = pending.filter(r => r.date >= todayISO()).sort((a, b) => a.date.localeCompare(b.date) || (a.time || '').localeCompare(b.time || ''));
    return { state: 'ok', count: pending.length, overdue, next: up[0] || null };
  };
  const computeEvents = () => {
    const events = [];
    const today = todayISO();
    const u = computeUnas();
    if (u.state === 'ok') events.push({ view: 'unas', icon: '💅', title: `Uñas de ${u.kind}`, date: u.date, meta: 'Próximo turno' });
    const c = computeCiclo();
    if (c.state === 'ok' || c.state === 'today' || c.state === 'overdue') {
      events.push({ view: 'ciclo', icon: '🌸', title: c.state === 'overdue' ? 'Período (atrasado)' : 'Próximo período', date: c.date, meta: c.state === 'overdue' ? `Atraso de ${c.days} días` : 'Ciclo menstrual' });
    }
    const tD = readLS(KEY_TURNOS);
    if (tD && Array.isArray(tD.appointments)) {
      for (const a of tD.appointments) {
        if (!a || !isValidISODate(a.date) || a.date < today) continue;
        if (normalizeApptStatus(a) !== 'pending') continue;
        events.push({ view: 'turnos', icon: '📅', title: a.title || 'Turno', date: a.date, time: a.time, meta: a.place || 'Turno agendado' });
      }
    }
    const rD = readLS(KEY_RECORDATORIOS);
    if (rD && Array.isArray(rD.reminders)) {
      for (const r of rD.reminders) {
        if (!r || !isValidISODate(r.date) || r.done || r.date < today) continue;
        events.push({ view: 'recordatorios', icon: '🔔', title: r.title || 'Recordatorio', date: r.date, time: r.time, meta: 'Recordatorio' });
      }
    }
    events.sort((a, b) => a.date !== b.date ? a.date.localeCompare(b.date) : (a.time || '').localeCompare(b.time || ''));
    return events;
  };
  const computeAlerts = () => {
    const alerts = [];
    const c = computeCiclo();
    if (c.state === 'overdue' && c.days >= 3) alerts.push({ icon: '🌸', text: `Tu período está ${c.days} días atrasado.`, danger: c.days >= 7 });
    const rD = readLS(KEY_RECORDATORIOS);
    if (rD && Array.isArray(rD.reminders)) {
      const v = rD.reminders.filter(r => r && isValidISODate(r.date) && !r.done && r.date < todayISO()).length;
      if (v > 0) alerts.push({ icon: '🔔', text: `Tenés ${v} recordatorio${v === 1 ? '' : 's'} vencido${v === 1 ? '' : 's'}.` });
    }
    return alerts;
  };

  const parseHash = () => {
    const raw = (location.hash || '').replace(/^#\/?/, '').trim();
    return VIEWS[raw] ? raw : DEFAULT_VIEW;
  };
  const navigate = view => {
    if (!VIEWS[view]) view = DEFAULT_VIEW;
    const target = '#/' + view;
    if (location.hash !== target) location.hash = target;
    else renderView(view);
  };
  const onHashChange = () => renderView(parseHash());

  const renderNav = () => {
    const d = $('navDesktop'), m = $('navMobile');
    d.textContent = ''; m.textContent = '';
    for (const [key, v] of Object.entries(VIEWS)) {
      const db = document.createElement('button');
      db.type = 'button'; db.dataset.view = key;
      db.innerHTML = `<span class="nav-ico" aria-hidden="true">${v.icon}</span><span>${v.label}</span>`;
      db.addEventListener('click', () => navigate(key));
      d.appendChild(db);
      const mb = document.createElement('button');
      mb.type = 'button'; mb.dataset.view = key;
      mb.innerHTML = `<span class="nm-ico" aria-hidden="true">${v.icon}</span><span class="nm-label">${v.label}</span>`;
      mb.addEventListener('click', () => navigate(key));
      m.appendChild(mb);
    }
  };
  const setActiveNav = view => {
    document.querySelectorAll('[data-view]').forEach(el => {
      if (el.tagName === 'BUTTON' && el.parentElement && (el.parentElement.id === 'navDesktop' || el.parentElement.id === 'navMobile')) {
        el.classList.toggle('active', el.dataset.view === view);
      }
    });
  };

  const viewHeader = ({ tag, title, subtitle }) => `
    <div class="page-head">
      ${tag ? `<div class="tag">${escapeHtml(tag)}</div>` : ''}
      <h1>${escapeHtml(title)}</h1>
      ${subtitle ? `<p>${escapeHtml(subtitle)}</p>` : ''}
    </div>
  `;
  const placeholder = ({ icon, title, description }) => `
    <div class="placeholder">
      <div class="ph-icon" aria-hidden="true">${icon}</div>
      <h2>${escapeHtml(title)}</h2>
      <p>${escapeHtml(description)}</p>
    </div>
  `;
  const renderSummaryCard = ({ view, icon, label, value, sub, state }) => {
    const cls = state && state !== 'ok' ? `is-${state}` : '';
    return `<div class="summary-card ${cls}" data-view="${escapeHtml(view)}" role="button" tabindex="0"><div class="sc-ico" aria-hidden="true">${icon}</div><div class="sc-label">${escapeHtml(label)}</div><div class="sc-value">${escapeHtml(value)}</div><div class="sc-sub">${escapeHtml(sub)}</div></div>`;
  };
  const whenLabel = date => {
    const d = dayDiff(todayISO(), date);
    if (d < 0) return `Hace ${-d} día${-d === 1 ? '' : 's'}`;
    if (d === 0) return 'HOY';
    if (d === 1) return 'MAÑANA';
    return `En ${d} días`;
  };

  let toastTimer = null;
  function showToast(msg, type = 'success', options = {}) {
    const el = $('toast');
    if (!el) return;
    el.textContent = '';
    const text = document.createElement('span');
    text.textContent = msg;
    el.appendChild(text);
    el.classList.toggle('error', type === 'error');
    if (options.action) {
      const btn = document.createElement('button');
      btn.className = 'toast-action';
      btn.type = 'button';
      btn.textContent = options.action.label;
      btn.addEventListener('click', () => {
        try { options.action.onClick && options.action.onClick(); } catch (e) { logErr(e); }
        el.classList.remove('show');
        clearTimeout(toastTimer);
      });
      el.appendChild(btn);
    }
    el.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => el.classList.remove('show'), options.duration || 3500);
  }
  window.__hubToast = showToast;

  const newId = () => {
    if (typeof crypto !== 'undefined' && typeof crypto.randomUUID === 'function') { try { return crypto.randomUUID(); } catch (e) {} }
    return 'x' + Date.now().toString(36) + Math.random().toString(36).slice(2, 10);
  };

  /* ==================== UÑAS ==================== */
  const unasModule = (() => {
    const DB_NAME = 'agendaUnasDB'; const DB_VERSION = 1; const PHOTO_STORE = 'photos';
    const MAX_PHOTOS_PER_KIND = 3; const PHOTO_MAX_DIM = 900; const PHOTO_QUALITY = 0.75;
    const VALID_TIMES = ['09:00', '12:00', '18:00'];
    const DEFAULTS = () => ({ settings: { handsInterval: 3, feetInterval: 5, leadDays: 3, reminderTime: '09:00' }, visits: [] });
    let state = DEFAULTS();
    const photoCache = new Map();
    let pendingPhoto = null, pendingPhotoKind = null, saving = false;
    let dbPromise = null, dbSupported = 'indexedDB' in window, lsAvailable = true;
    let currentMountId = 0;
    try { const k = '__t__' + Math.random(); localStorage.setItem(k, '1'); localStorage.removeItem(k); }
    catch (e) { lsAvailable = false; }
    const toast = (msg, type) => window.__hubToast ? window.__hubToast(msg, type) : console.log(msg);

    const openDB = () => {
      if (dbPromise) return dbPromise;
      if (!dbSupported) return Promise.reject(new Error('no-idb'));
      dbPromise = new Promise((resolve, reject) => {
        let req;
        try { req = indexedDB.open(DB_NAME, DB_VERSION); }
        catch (e) { dbSupported = false; reject(e); return; }
        req.onupgradeneeded = () => {
          const db = req.result;
          if (!db.objectStoreNames.contains(PHOTO_STORE)) db.createObjectStore(PHOTO_STORE, { keyPath: 'visitId' });
        };
        req.onsuccess = () => resolve(req.result);
        req.onerror = () => { dbSupported = false; reject(req.error || new Error('idb')); };
        req.onblocked = () => reject(new Error('idb-blocked'));
      });
      return dbPromise;
    };
    const idbOp = (mode, fn) => new Promise((resolve, reject) => {
      openDB().then(db => {
        let t; try { t = db.transaction(PHOTO_STORE, mode); } catch (e) { reject(e); return; }
        let out; try { out = fn(t.objectStore(PHOTO_STORE)); } catch (e) { reject(e); return; }
        t.oncomplete = () => resolve(out && 'result' in out ? out.result : out);
        t.onerror = () => reject(t.error); t.onabort = () => reject(t.error);
      }).catch(reject);
    });
    const putPhoto = p => idbOp('readwrite', s => s.put(p));
    const deletePhoto = id => idbOp('readwrite', s => s.delete(id));
    const getAllPhotos = () => idbOp('readonly', s => s.getAll());
    const clearPhotos = () => idbOp('readwrite', s => s.clear());

    const loadImgFromFile = file => new Promise((resolve, reject) => {
      if (typeof FileReader === 'undefined') { reject(new Error('no-fr')); return; }
      const r = new FileReader();
      r.onload = () => { const img = new Image(); img.onload = () => resolve(img); img.onerror = () => reject(new Error('img')); img.src = r.result; };
      r.onerror = () => reject(new Error('read'));
      r.readAsDataURL(file);
    });
    const compressImage = async (file, maxDim = PHOTO_MAX_DIM, quality = PHOTO_QUALITY) => {
      const img = await loadImgFromFile(file);
      let w = img.naturalWidth || img.width, h = img.naturalHeight || img.height;
      if (!w || !h) throw new Error('dim');
      const ratio = Math.min(1, maxDim / Math.max(w, h));
      w = Math.max(1, Math.round(w * ratio)); h = Math.max(1, Math.round(h * ratio));
      const canvas = document.createElement('canvas');
      canvas.width = w; canvas.height = h;
      const ctx = canvas.getContext('2d');
      if (!ctx) throw new Error('canvas');
      ctx.drawImage(img, 0, 0, w, h);
      return canvas.toDataURL('image/jpeg', quality);
    };

    const sanitizeSettings = raw => {
      const out = { ...DEFAULTS().settings };
      if (!raw || typeof raw !== 'object') return out;
      const hi = Number(raw.handsInterval), fi = Number(raw.feetInterval), ld = Number(raw.leadDays);
      if (Number.isInteger(hi) && hi >= 1 && hi <= 52) out.handsInterval = hi;
      if (Number.isInteger(fi) && fi >= 1 && fi <= 52) out.feetInterval = fi;
      if (Number.isInteger(ld) && ld >= 0 && ld <= 30) out.leadDays = ld;
      if (typeof raw.reminderTime === 'string' && VALID_TIMES.includes(raw.reminderTime)) out.reminderTime = raw.reminderTime;
      return out;
    };
    const sanitizeVisit = v => {
      if (!v || typeof v !== 'object') return null;
      if (!['manos','pies'].includes(v.kind)) return null;
      if (!isValidISODate(v.date)) return null;
      return { id: (typeof v.id === 'string' && v.id) ? v.id : newId(), kind: v.kind, date: v.date };
    };
    const sanitizeState = raw => {
      const out = { settings: sanitizeSettings(raw && raw.settings), visits: [] };
      if (raw && Array.isArray(raw.visits)) {
        const seen = new Set();
        for (const v of raw.visits) {
          const c = sanitizeVisit(v);
          if (!c) continue;
          if (seen.has(c.id)) c.id = newId();
          seen.add(c.id); out.visits.push(c);
        }
      }
      return out;
    };
    const save = () => {
      if (!lsAvailable) { toast('Tu navegador bloquea el guardado.', 'error'); return false; }
      try { localStorage.setItem(KEY_UNAS, JSON.stringify({ version: 2, settings: state.settings, visits: state.visits })); return true; }
      catch (e) { toast('No se pudieron guardar los datos.', 'error'); return false; }
    };
    const load = () => {
      if (!lsAvailable) { state = DEFAULTS(); return; }
      try { const raw = localStorage.getItem(KEY_UNAS); if (raw) state = sanitizeState(JSON.parse(raw)); }
      catch (e) { state = DEFAULTS(); }
    };
    const interval = kind => Number(kind === 'manos' ? state.settings.handsInterval : state.settings.feetInterval) * 7;
    const latest = kind => state.visits.filter(v => v.kind === kind).sort((a, b) => b.date.localeCompare(a.date) || b.id.localeCompare(a.id))[0];
    const dueDate = kind => { const v = latest(kind); return v ? addDaysISO(v.date, interval(kind)) : ''; };
    const reminderText = kind => {
      const due = dueDate(kind);
      if (!due) return { text: 'Registrá la última visita', cls: '' };
      const delta = dayDiff(todayISO(), due);
      const lead = Number(state.settings.leadDays) || 0;
      const time = state.settings.reminderTime || '09:00';
      if (delta < 0) return { text: `Se pasó hace ${Math.abs(delta)} día${Math.abs(delta) === 1 ? '' : 's'}`, cls: 'overdue' };
      if (delta <= lead) return { text: delta === 0 ? `¡Toca pedir turno! · aviso ${time}` : `Aviso: faltan ${delta} día${delta === 1 ? '' : 's'} · ${time}`, cls: delta === 0 ? 'today' : 'warn' };
      return { text: `En ${delta} día${delta === 1 ? '' : 's'}`, cls: '' };
    };
    const loadPhotoCache = async () => {
      photoCache.clear();
      if (!dbSupported) return;
      try { const all = await getAllPhotos(); for (const p of all || []) if (p && typeof p.visitId === 'string' && typeof p.dataUrl === 'string') photoCache.set(p.visitId, p.dataUrl); }
      catch (e) { logErr('loadPhotoCache', e); }
    };
    const cleanupOrphans = async () => {
      if (!dbSupported) return;
      const valid = new Set(state.visits.map(v => v.id));
      for (const id of Array.from(photoCache.keys())) {
        if (!valid.has(id)) { photoCache.delete(id); try { await deletePhoto(id); } catch (e) {} }
      }
    };
    const prunePhotos = async kind => {
      if (!dbSupported) return;
      const list = [];
      for (const [id] of photoCache) { const v = state.visits.find(x => x.id === id); if (v && v.kind === kind) list.push({ id, date: v.date }); }
      list.sort((a, b) => b.date.localeCompare(a.date) || b.id.localeCompare(a.id));
      for (let i = MAX_PHOTOS_PER_KIND; i < list.length; i++) { photoCache.delete(list[i].id); try { await deletePhoto(list[i].id); } catch (e) {} }
    };
    const pruneAll = async () => { if (!dbSupported) return; for (const k of ['manos', 'pies']) await prunePhotos(k); };

    const renderSections = () => {
      const cardsEl = $('unasCards'), historyEl = $('unasHistory');
      if (!cardsEl || !historyEl) return;
      cardsEl.innerHTML = ['manos', 'pies'].map(kind => {
        const v = latest(kind), due = dueDate(kind), photo = v ? photoCache.get(v.id) : null, rem = reminderText(kind);
        return `<article class="nail-card" data-kind="${kind}"><div class="card-top"><div class="emoji" aria-hidden="true">${kind === 'manos' ? '💅' : '🦶'}</div><div><h3>Uñas de ${kind}</h3><small>${v ? 'Última visita: ' + escapeHtml(fmtDate(v.date)) : 'Todavía sin registrar'}</small></div></div>${photo ? `<div class="card-photo"><img src="${photo}" alt="Foto de la última visita de ${kind}" loading="lazy" data-visit="${escapeHtml(v.id)}"></div>` : ''}<div class="card-body"><div class="next-label">Próxima visita estimada</div><div class="next-date">${due ? escapeHtml(fmtDate(due)) : 'Añadí una fecha'}</div><span class="pill ${rem.cls}">${escapeHtml(rem.text)}</span><button class="btn btn-primary" type="button" data-done="${kind}">Uñas listas</button></div></article>`;
      }).join('');
      const sorted = [...state.visits].sort((a, b) => b.date.localeCompare(a.date) || b.id.localeCompare(a.id));
      if (!sorted.length) historyEl.innerHTML = '<div class="empty">Todavía no hay visitas. Cuando registres una, aparecerá acá.</div>';
      else historyEl.innerHTML = sorted.map(v => {
        const dataUrl = photoCache.get(v.id);
        return `<div class="history-item"><div class="history-left">${dataUrl ? `<img class="history-thumb" src="${dataUrl}" alt="Foto de ${v.kind}" loading="lazy" data-visit="${escapeHtml(v.id)}">` : ''}<div><strong>${v.kind === 'manos' ? 'Manos' : 'Pies'}</strong><small>${escapeHtml(fmtDateLong(v.date))}</small></div></div><button class="btn btn-ghost btn-sm" type="button" data-delete="${escapeHtml(v.id)}">Eliminar</button></div>`;
      }).join('');
      bindSectionListeners();
    };
    const bindSectionListeners = () => {
      const mountAtBind = currentMountId;
      const cardsEl = $('unasCards');
      if (cardsEl && !cardsEl._bound) {
        cardsEl.addEventListener('click', async e => {
          if (mountAtBind !== currentMountId) return;
          const img = e.target.closest('img[data-visit]');
          if (img) { openLightbox(photoCache.get(img.dataset.visit)); return; }
          const btn = e.target.closest('[data-done]');
          if (!btn || btn.disabled) return;
          btn.disabled = true;
          try { await registerVisit(btn.dataset.done, todayISO(), null); }
          finally { if (btn.isConnected) btn.disabled = false; }
        });
        cardsEl._bound = true;
      }
      const histEl = $('unasHistory');
      if (histEl && !histEl._bound) {
        histEl.addEventListener('click', async e => {
          if (mountAtBind !== currentMountId) return;
          const img = e.target.closest('img[data-visit]');
          if (img) { openLightbox(photoCache.get(img.dataset.visit)); return; }
          const btn = e.target.closest('[data-delete]');
          if (!btn || btn.disabled) return;
          await deleteVisit(btn.dataset.delete);
        });
        histEl._bound = true;
      }
    };
    const openLightbox = src => {
      if (!src) return;
      const lb = $('unasLightbox'), img = $('unasLightboxImg');
      if (!lb || !img) return;
      img.src = src; lb.hidden = false;
      try { $('unasLightboxClose').focus(); } catch (e) {}
    };
    const closeLightbox = () => {
      const lb = $('unasLightbox');
      if (!lb) return;
      lb.hidden = true; $('unasLightboxImg').src = '';
    };
    const clearPhotoSelection = () => {
      pendingPhoto = null; pendingPhotoKind = null;
      const inp = $('unasPhoto'); if (inp) inp.value = '';
      const prev = $('unasPhotoPreview'); if (prev) prev.textContent = '';
      const wrap = $('unasPhotoPreviewWrap'); if (wrap) wrap.hidden = true;
    };
    const registerVisit = async (kind, date, photoDataUrl) => {
      if (!isValidISODate(date)) { toast('Elegí una fecha válida.', 'error'); return false; }
      if (date > todayISO()) { toast('La fecha no puede ser futura.', 'error'); return false; }
      const existing = state.visits.find(v => v.kind === kind && v.date === date);
      if (existing) {
        if (photoDataUrl && dbSupported) {
          try {
            await putPhoto({ visitId: existing.id, dataUrl: photoDataUrl });
            photoCache.set(existing.id, photoDataUrl);
            await prunePhotos(kind);
            renderSections(); clearPhotoSelection();
            toast(`Foto guardada para la visita de ${kind}.`);
            return true;
          } catch (e) { toast('No se pudo guardar la foto.', 'error'); return false; }
        }
        clearPhotoSelection();
        toast(`La visita de ${kind} de ${fmtDate(date)} ya está registrada.`);
        return true;
      }
      const visit = { id: newId(), kind, date };
      state.visits.push(visit);
      if (!save()) { state.visits = state.visits.filter(v => v.id !== visit.id); return false; }
      if (photoDataUrl && dbSupported) {
        try { await putPhoto({ visitId: visit.id, dataUrl: photoDataUrl }); photoCache.set(visit.id, photoDataUrl); await prunePhotos(kind); }
        catch (e) { toast('La visita se guardó, pero la foto no.', 'error'); }
      }
      renderSections(); clearPhotoSelection();
      toast(`Visita de ${kind} guardada.`);
      return true;
    };
    const deleteVisit = async id => {
      const v = state.visits.find(x => x.id === id);
      if (!v) return;
      if (!window.confirm(`¿Eliminar la visita de ${v.kind} del ${fmtDateLong(v.date)}?`)) return;
      state.visits = state.visits.filter(x => x.id !== id);
      if (!save()) { state.visits.push(v); return; }
      if (photoCache.has(id)) { photoCache.delete(id); try { await deletePhoto(id); } catch (e) {} }
      renderSections(); toast('Visita eliminada.');
    };
    const fillSettingsInputs = () => {
      const hi = $('unasHandsInterval'); if (hi) hi.value = state.settings.handsInterval;
      const fi = $('unasFeetInterval'); if (fi) fi.value = state.settings.feetInterval;
      const ld = $('unasLeadDays'); if (ld) ld.value = state.settings.leadDays;
      const rt = $('unasReminderTime');
      if (rt) { const v = state.settings.reminderTime || '09:00'; rt.value = Array.from(rt.options).some(o => o.value === v) ? v : '09:00'; }
    };
    const setInputDate = val => {
      const inp = $('unasDate'); if (!inp || !isValidISODate(val)) return;
      inp.value = val; try { inp.valueAsDate = new Date(val + 'T00:00:00'); } catch (e) {}
    };
    const getInputDate = () => {
      const inp = $('unasDate'); if (!inp) return todayISO();
      const raw = inp.value; if (isValidISODate(raw)) return raw;
      try { if (inp.valueAsDate instanceof Date && !isNaN(inp.valueAsDate.getTime())) return toISODate(inp.valueAsDate); } catch (e) {}
      return todayISO();
    };
    const mount = async () => {
      currentMountId++;
      pendingPhoto = null; pendingPhotoKind = null;
      load();
      try { await loadPhotoCache(); await cleanupOrphans(); await pruneAll(); }
      catch (e) { logErr('unas mount', e); }
      fillSettingsInputs(); setInputDate(todayISO()); renderSections();
      const photoInp = $('unasPhoto');
      if (photoInp) photoInp.addEventListener('change', async e => {
        const file = e.target.files && e.target.files[0];
        if (!file) { clearPhotoSelection(); return; }
        try {
          const dataUrl = await compressImage(file);
          pendingPhoto = dataUrl;
          pendingPhotoKind = $('unasKind') ? $('unasKind').value : null;
          const wrap = $('unasPhotoPreviewWrap'), prev = $('unasPhotoPreview');
          if (prev) { prev.textContent = ''; const img = document.createElement('img'); img.src = dataUrl; img.alt = 'Vista previa'; prev.appendChild(img); }
          if (wrap) wrap.hidden = false;
        } catch (err) { clearPhotoSelection(); toast('No se pudo procesar la imagen.', 'error'); }
      });
      const clearBtn = $('unasClearPhoto'); if (clearBtn) clearBtn.addEventListener('click', clearPhotoSelection);
      const kindSel = $('unasKind');
      if (kindSel) kindSel.addEventListener('change', () => {
        if (pendingPhoto && pendingPhotoKind && pendingPhotoKind !== kindSel.value) {
          clearPhotoSelection(); toast('Cambiaste el tipo. Volvé a elegir la foto.', 'error');
        }
      });
      const saveBtn = $('unasSaveVisit');
      if (saveBtn) saveBtn.addEventListener('click', async () => {
        if (saving) return;
        saving = true; saveBtn.disabled = true;
        try {
          const ok = await registerVisit($('unasKind').value, getInputDate(), pendingPhoto);
          if (ok) { setInputDate(todayISO()); clearPhotoSelection(); }
        } catch (e) { toast('Error inesperado al guardar.', 'error'); }
        finally { saving = false; if (saveBtn.isConnected) saveBtn.disabled = false; }
      });
      const saveSet = $('unasSaveSettings');
      if (saveSet) saveSet.addEventListener('click', () => {
        const parse = (v, mn, mx) => { const n = Number(v); return Number.isInteger(n) && n >= mn && n <= mx ? n : null; };
        const hi = parse($('unasHandsInterval').value, 1, 52), fi = parse($('unasFeetInterval').value, 1, 52);
        const ld = parse($('unasLeadDays').value, 0, 30), rt = $('unasReminderTime').value;
        if (hi === null || fi === null || ld === null || !VALID_TIMES.includes(rt)) { toast('Revisá los valores.', 'error'); return; }
        state.settings = { handsInterval: hi, feetInterval: fi, leadDays: ld, reminderTime: rt };
        if (!save()) return;
        renderSections(); toast('Configuración guardada.');
      });
      const exportBtn = $('unasExportData');
      if (exportBtn) exportBtn.addEventListener('click', () => {
        try {
          const data = { app: 'agenda-unas', version: 2, exportedAt: new Date().toISOString(), settings: state.settings, visits: state.visits.map(v => ({ id: v.id, kind: v.kind, date: v.date, photo: photoCache.get(v.id) || null })) };
          const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
          const url = URL.createObjectURL(blob); const a = document.createElement('a');
          a.href = url; a.download = `copia-agenda-unas-${todayISO()}.json`;
          document.body.appendChild(a); a.click(); a.remove();
          setTimeout(() => URL.revokeObjectURL(url), 1000);
          toast('Copia exportada.');
        } catch (e) { toast('No se pudo exportar.', 'error'); }
      });
      const resetBtn = $('unasResetData');
      if (resetBtn) resetBtn.addEventListener('click', async () => {
        if (!window.confirm('¿Borrar todas las visitas, fotos y configuración de uñas?')) return;
        state = DEFAULTS(); save(); photoCache.clear();
        try { await clearPhotos(); } catch (e) {}
        fillSettingsInputs(); renderSections(); setInputDate(todayISO()); clearPhotoSelection();
        toast('Datos de uñas borrados.');
      });
      const importBtn = $('unasImportData'), importFile = $('unasImportFile');
      if (importBtn && importFile) {
        importBtn.addEventListener('click', () => importFile.click());
        importFile.addEventListener('change', async e => {
          const f = e.target.files && e.target.files[0]; e.target.value = '';
          if (!f) return;
          if (!window.confirm('Restaurar la copia reemplazará todos los datos de uñas. ¿Continuar?')) return;
          try {
            const raw = JSON.parse(await f.text());
            if (!raw || typeof raw !== 'object' || !Array.isArray(raw.visits)) throw new Error('formato');
            const sanitized = sanitizeState(raw);
            const incoming = new Map();
            for (const v of raw.visits) {
              if (!v || typeof v !== 'object') continue;
              if (typeof v.photo !== 'string' || v.photo.indexOf('data:image/') !== 0) continue;
              const clean = sanitized.visits.find(x => x.id === v.id) || sanitized.visits.find(x => x.kind === v.kind && x.date === v.date);
              if (clean) incoming.set(clean.id, v.photo);

    const sortByDateTime = (a, b) => a.date !== b.date ? a.date.localeCompare(b.date) : (a.time || '99:99').localeCompare(b.time || '99:99');

        const delBtn = e.target.closest('[data-delete]');

        const saveEdit = e.target.closest('[data-save-edit]');
        if (saveEdit) { saveEditAppt(saveEdit.dataset.saveEdit); return; }
        const cancelEdit = e.target.closest('[data-cancel-edit]');

    const closeAppt = (id, status) => {

      const prev = a.status;
      a.status = status;
      if (!save()) { a.status = prev; return; }
      renderStatsCards(); renderList();

    };
    const reopenAppt = id => {

    const addAppointment = () => {
      const title = $('turnosTitle').value.trim();
      const date = $('turnosDate').value;
      const time = $('turnosTime').value;
      const place = $('turnosPlace').value.trim();
      const notes = $('turnosNotes').value.trim();
      if (!title) { toast('Poné un título.', 'error'); return false; }
      if (!isValidISODate(date)) { toast('Elegí una fecha válida.', 'error'); return false; }
      if (time && !isValidTime(time)) { toast('Hora inválida.', 'error'); return false; }
      state.appointments.push({ id: newId(), title, date, time, place, notes, status: 'pending' });

    const resetForm = () => {

      const ti = $('turnosTime'); if (ti) ti.value = '';

    const mount = () => {

      const addBtn = $('turnosAdd');

      const exportBtn = $('turnosExportData');
      if (exportBtn) exportBtn.addEventListener('click', () => {
        try {
          const data = { app: 'hub-turnos', version: 2, exportedAt: new Date().toISOString(), appointments: state.appointments };
          const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
          const url = URL.createObjectURL(blob); const a = document.createElement('a');

  /* ==================== RECORDATORIOS ==================== */
  const recordatoriosModule = (() => {
    const DEFAULTS = () => ({ reminders: [] });

    let currentFilter = 'pendientes', editingId = null, currentMountId = 0;

    const sanitizeReminder = r => {
      if (!r || typeof r !== 'object') return null;
      if (!isValidISODate(r.date)) return null;

      if (!title) return null;
      const time = isValidTime(r.time) ? r.time : '';
      const notes = (typeof r.notes === 'string' ? r.notes : '').trim();
      return { id: (typeof r.id === 'string' && r.id) ? r.id : newId(), title, date: r.date, time, notes, done: !!r.done };

    const sanitizeState = raw => {
      const out = { reminders: [] };

        const seen = new Set();
        for (const r of raw.reminders) {
          const c = sanitizeReminder(r);

          seen.add(c.id); out.reminders.push(c);

    };
    const save = () => {

      catch (e) { toast('No se pudieron guardar los datos.', 'error'); return false; }
    };
    const load = () => {
      if (!lsAvailable) return;

      catch (e) { state = DEFAULTS(); }
    };
    const sortByDate = (a, b) => a.date !== b.date ? a.date.localeCompare(b.date) : (a.time || '99:99').localeCompare(b.time || '99:99');
    const pendientes = () => state.reminders.filter(r => !r.done).sort(sortByDate);
    const cumplidos = () => state.reminders.filter(r => r.done).sort((a, b) => sortByDate(b, a));
    const stats = () => ({
      total: state.reminders.length,
      pending: state.reminders.filter(r => !r.done).length,
      today: state.reminders.filter(r => !r.done && r.date === todayISO()).length,

    const renderStatsCards = () => {

      const editFormHtml = isEditing ? `

            <div><label>Fecha</label><input type="date" data-edit-date value="${escapeHtml(r.date)}"></div>

      return `
        <div class="${classes.join(' ')}" data-reminder="${escapeHtml(r.id)}">

            <div class="reminder-meta">${metaParts.join('')}</div>
            ${notesHtml}
            ${editFormHtml}
          </div>
          ${!isEditing ? `
            <div class="reminder-actions">
              <button class="btn btn-ghost btn-icon" type="button" data-edit="${escapeHtml(r.id)}" aria-label="Editar" title="Editar">✏️</button>
              <button class="btn btn-ghost btn-icon" type="button" data-delete="${escapeHtml(r.id)}" aria-label="Eliminar" title="Eliminar">🗑</button>
            </div>
          ` : ''}
        </div>
      `;
    };

    const renderList = () => {
      const el = $('recList'); if (!el) return;
      updateTabCounts();
      const list = currentFilter === 'pendientes' ? pendientes() : cumplidos();
      if (!list.length) {
        el.innerHTML = `<div class="empty">${currentFilter === 'pendientes' ? 'No tenés recordatorios pendientes.' : 'Todavía no marcaste ninguno como cumplido.'}</div>`;

    const bindListListeners = () => {
      const el = $('recList'); if (!el) return;

        if (mountAtBind !== currentMountId) return;
        const markBtn = e.target.closest('[data-mark-done]');

        const saveEdit = e.target.closest('[data-save-edit]');
        if (saveEdit) { saveEditReminder(saveEdit.dataset.saveEdit); return; }
        const cancelEdit = e.target.closest('[data-cancel-edit]');

        if (reopen) { reopenReminder(reopen.dataset.reopen); return; }
      });
    };

    const markDone = id => {
      const r = state.reminders.find(x => x.id === id); if (!r) return;
      r.done = true;
      if (!save()) { r.done = false; return; }
      renderStatsCards(); renderList();
      toast('Recordatorio cumplido.', 'success', {
        duration: 6000,
        action: {

      const r = state.reminders.find(x => x.id === id); if (!r) return;
      r.title = title; r.date = date; r.time = time; r.notes = notes;

      editingId = null; renderStatsCards(); renderList(); toast('Recordatorio actualizado.');

      const time = $('recTime').value;

      if (!isValidISODate(date)) { toast('Elegí una fecha válida.', 'error'); return false; }
      if (time && !isValidTime(time)) { toast('Hora inválida.', 'error'); return false; }
      state.reminders.push({ id: newId(), title, date, time, notes, done: false });

  /* ==================== AJUSTES ==================== */
  const ajustesModule = (() => {
    const toast = (msg, type) => window.__hubToast ? window.__hubToast(msg, type) : console.log(msg);
    const readRaw = key => { try { return localStorage.getItem(key); } catch (e) { return null; } };
    const estimateBytes = s => (s ? new Blob([s]).size : 0);
    const fmtBytes = bytes => {
      if (bytes < 1024) return bytes + ' B';
      if (bytes < 1024 * 1024) return (bytes / 1024).toFixed(1) + ' KB';
      return (bytes / (1024 * 1024)).toFixed(2) + ' MB';
    };
    const computeCounts = () => {
      const unas = readLS(KEY_UNAS) || {};
      const ciclo = readLS(KEY_CICLO) || {};
      const turnos = readLS(KEY_TURNOS) || {};
      const recs = readLS(KEY_RECORDATORIOS) || {};
      return {
        unas: (unas.visits || []).length,
        ciclo: (ciclo.periods || []).length,
        turnos: (turnos.appointments || []).length,
        recs: (recs.reminders || []).length,
      };
    };
    const computeStorage = () => {
      const keys = [KEY_UNAS, KEY_CICLO, KEY_TURNOS, KEY_RECORDATORIOS, THEME_KEY];
      let total = 0;
      for (const k of keys) total += estimateBytes(readRaw(k));
      return total;
    };

    const renderOverview = () => {
      const el = $('ajustesOverview'); if (!el) return;
      const c = computeCounts();
      const totalBytes = computeStorage();
      const maxBytes = 5 * 1024 * 1024;

        <div class="setting-row">
          <div class="sr-info" style="width:100%;">
            <div class="sr-title">Uso de almacenamiento</div>
            <div class="sr-desc">Los datos viven en este navegador. Estimado de localStorage.</div>
            <div class="storage-bar-wrap">
              <div class="storage-bar"><div class="storage-bar-fill" style="width:${pct}%"></div></div>
              <div class="storage-info"><span>${fmtBytes(totalBytes)} usados</span><span>límite típico ~5 MB</span></div>
            </div>
          </div>
        </div>
        <div class="setting-row">
          <div class="sr-info">
            <div class="sr-title">Versión</div>

          </div>

    };

    const doExportAll = () => {
      try {
        const bundle = {
          app: 'mi-espacio-hub',
          version: HUB_VERSION,
          exportedAt: new Date().toISOString(),
          theme: currentTheme,
          data: {
            unas: readLS(KEY_UNAS),

            turnos: readLS(KEY_TURNOS),
            recordatorios: readLS(KEY_RECORDATORIOS),
          },
        };
        const blob = new Blob([JSON.stringify(bundle, null, 2)], { type: 'application/json' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url; a.download = `mi-espacio-backup-${todayISO()}.json`;
        document.body.appendChild(a); a.click(); a.remove();
        setTimeout(() => URL.revokeObjectURL(url), 1000);
        toast('Copia completa exportada.');
      } catch (e) { toast('No se pudo exportar.', 'error'); }
    };

    const doImportAll = async file => {
      try {
        const raw = JSON.parse(await file.text());
        if (!raw || typeof raw !== 'object') throw new Error('formato');
        const data = raw.data || raw;
        const hasAny = ['unas', 'ciclo', 'turnos', 'recordatorios'].some(k => data[k]);
        if (!hasAny) throw new Error('sin-secciones');
        const backup = {
          [KEY_UNAS]: readRaw(KEY_UNAS),
          [KEY_CICLO]: readRaw(KEY_CICLO),
          [KEY_TURNOS]: readRaw(KEY_TURNOS),
          [KEY_RECORDATORIOS]: readRaw(KEY_RECORDATORIOS),
        };
        let restoredCount = 0;
        for (const [key, val] of Object.entries({
          [KEY_UNAS]: data.unas,
          [KEY_CICLO]: data.ciclo,
          [KEY_TURNOS]: data.turnos,
          [KEY_RECORDATORIOS]: data.recordatorios,
        })) {
          if (val && typeof val === 'object') {
            try { localStorage.setItem(key, JSON.stringify(val)); restoredCount++; }
            catch (e) { logErr('import write', key, e); }
          }
        }
        if (restoredCount === 0) {
          for (const [k, v] of Object.entries(backup)) {
            if (v !== null) try { localStorage.setItem(k, v); } catch (e) {}
          }
          throw new Error('nada-restaurado');
        }
        if (typeof raw.theme === 'string' && (raw.theme === 'light' || raw.theme === 'dark')) {
          currentTheme = raw.theme;
          applyTheme(currentTheme); saveTheme(currentTheme);
        }
        renderOverview();
        toast(`Copia restaurada (${restoredCount} sección${restoredCount === 1 ? '' : 'es'}).`);

    const doResetAll = () => {
      const answer = window.prompt('Esta acción borrará TODOS los datos de las 4 secciones. Escribí BORRAR para confirmar.');

        localStorage.removeItem(KEY_UNAS);

        localStorage.removeItem(KEY_RECORDATORIOS);

            const req = indexedDB.deleteDatabase('agendaUnasDB');

        }
        renderOverview();
        toast('Todos los datos borrados.');
      } catch (e) { toast('No se pudo completar el borrado.', 'error'); }
    };

      renderOverview();

      if (exportBtn) exportBtn.addEventListener('click', doExportAll);
      const importBtn = $('ajustesImportAll'), importFile = $('ajustesImportFile');

    };
    return { mount };
  })();

      let subtitle = `${days[now.getDay()]} ${now.getDate()} de ${months[now.getMonth()]}`;

      else if (events.some(e => e.date === todayISO())) subtitle += ' · Tenés cosas para hoy';
      else if (events.length) subtitle += ` · ${events.length} evento${events.length === 1 ? '' : 's'} próximo${events.length === 1 ? '' : 's'}`;

      let unasCard;

      else if (unas.days < 0) unasCard = { view: 'unas', icon: '💅', label: 'Uñas', value: `Pasado hace ${-unas.days} día${-unas.days === 1 ? '' : 's'}`, sub: fmtDate(unas.date), state: 'warn' };
      else if (unas.days === 0) unasCard = { view: 'unas', icon: '💅', label: 'Uñas', value: '¡Hoy!', sub: unas.kind, state: 'today' };
      else unasCard = { view: 'unas', icon: '💅', label: 'Uñas', value: `En ${unas.days} día${unas.days === 1 ? '' : 's'}`, sub: `${unas.kind} · ${fmtDate(unas.date)}`, state: 'ok' };

      else if (ciclo.state === 'today') cicloCard = { view: 'ciclo', icon: '🌸', label: 'Ciclo', value: '¡Hoy!', sub: 'Período esperado', state: 'today' };
